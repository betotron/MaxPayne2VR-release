# que es lo que si te gusto del panel flotante: *"cuando yo muevo la cabeza me
# sigue, eso es muy bueno"*.
#
#   tira_en_la_mano   0 = delante de los ojos (lo de ahora).
#                     1 = encima de la mano derecha, como antes.
#   tira_distancia    metros por delante de los ojos.
#   tira_altura       metros por DEBAJO de los ojos. Negativo = mas abajo.
#   tira_ancho        lo mas ancha que se le deja ser, en metros. Al final del
#                     juego llevas hasta 17 armas; si no caben en este ancho,
#                     **se encogen todas por igual hasta que caben**, para que
