# -este numero de centimetros por debajo del casco, que lo llevas en los ojos- y
# tu mano se mide desde ahi.
#
# ES UNA MEDIDA TUYA, no del juego. 0,20 m es lo normal en una persona adulta.
# Si el brazo de Max te queda alto, sube el numero; si te queda bajo, bajalo.
#
# Y de paso: el codo ya no se dobla "hacia abajo" a secas. Con el brazo colgando,
# el brazo TAMBIEN va hacia abajo, la referencia se quedaba paralela y la
# direccion del codo salia de cualquier sitio: de ahi los saltos. Ahora apunta
# hacia atras y un poco hacia afuera, como un codo humano, que no es paralelo al
# brazo ni colgando ni levantado.
# ---------------------------------------------------------------------------

brazo_ojos_sobre_el_hombro = 0.2000

# ===========================================================================
# NO HACE FALTA QUE TOQUES ESTE NUMERO NI EL DE `brazo_escala`.  (C-095)
#
# NO HAY QUE APRETAR NADA.  (C-097)
#
# Dentro del juego, PONTE DE PIE EN POSICION T Y AGUANTA DOS SEGUNDOS. Ya esta.
#
# La posicion T de toda la vida: de pie, los dos brazos abiertos a los lados, a
# la altura de los hombros, con un mando en cada mano.
#
# Antes habia que apretar la tecla J, y lo cazaste tu: "para hacer la posicion T
# y apretar la tecla J tendre que hacerlo solo con la mano derecha... no tengo
# tres manos". Tenias razon. Ahora el mod mira si te has puesto en T y, si la
# aguantas dos segundos, se mide solo.
#
# La tecla `J` sigue ahi por si algun dia quieres forzarlo, pero ya no hace
# falta para nada.
#
# NO VALE OTRA POSTURA, y no porque yo sea tiquismiquis: la cuenta necesita que
# tu mano este justo a la altura de tu hombro, y eso solo pasa en la T. Pero eso
# no es problema tuyo: EL MOD LO COMPRUEBA. Mira tus dos manos y, si no estan a
# la misma altura, o no estan abiertas, o una esta mas estirada que la otra, NO
# CAMBIA NADA y te dice cual de las tres cosas arreglar.
#
# El mod se mide a ti solo. Con los brazos horizontales tu mano esta a la altura
# de tu hombro, asi que las dos cosas que hacen falta salen de una resta:
#
#     de tus ojos a tu hombro  =  altura de la cabeza - altura de la mano
#     tu alcance de brazo      =  de ahi a la mano
#
# Y con tu alcance se ajusta `brazo_escala` para que **tu brazo del todo
# estirado sea el brazo de Max del todo estirado**. Eso es lo que arregla que a
# alguien mas alto que Max se le salga la mano de su alcance.
#
# Se aplica AL INSTANTE. Si la postura no era una cruz, los numeros salen fuera
# de lo que puede ser una persona, el mod NO cambia nada y te lo dice.
#
# `J` no hace nada en Max Payne 2 -comprobado en su propio guion, no supuesto- y
# esta pegada a la `K` de recentrar y la `L` de marcar.
# ===========================================================================


