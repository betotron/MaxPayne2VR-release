# ---------------------------------------------------------------------------
# vigilar_la_camara   (C-155)   *** POR QUE AL CAMBIAR DE NIVEL SE PIERDE TODO ***
# ---------------------------------------------------------------------------
# El usuario lo describio antes de que hubiera ningun dato: *"al entrar en
