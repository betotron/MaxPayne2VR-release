# ---------------------------------------------------------------------------
# 11-octies. EL ARMA APUNTA HACIA DONDE SENALA TU MANO  (C-082)
#            *** ES EL CAMBIO DE ESTE CANDIDATO ***
#
# LO QUE ENSENO C-081, y lo viste tu con tus ojos: "antes movia el mouse del
# PC y ahi estaba el punto de mira; ahora mi cabeza tiene el punto de mira".
#
# Eso significa que update2DAiming MUEVE LA PUNTERIA, NO EL CUERPO. Y es la
# mejor noticia que hemos tenido: en este motor apuntar y encarar son cosas
# DISTINTAS, asi que puedes tener el arma en la mano SIN perder que el cuerpo
# vaya con la mirada.
#
#   0 = manda el juego (el raton del PC), como siempre
#   1 = manda TU MANO DERECHA. El arma apunta donde la senalas.   <-- esto
#   2 = manda la cabeza (lo que se probo en C-081)
#
# LAS CUENTAS ESTAN PROBADAS SIN ABRIR EL JUEGO. El convenio de la matriz no
# se adivino: se dedujo de los 3261 volcados de C-079, y hay una prueba
# automatica que coge esa matriz real, le saca los angulos, la reconstruye y
# comprueba que sale la misma. Si el convenio estuviera mal, no daria verde.
#
# LA TECLA H lo apaga y lo enciende sin salir del juego.
#
# NECESITA sonda_del_apuntado = 1, que es quien pone el gancho.
#
# OJO CON LA AYUDA DE PUNTERIA: en dificultad facil el juego pega el disparo
# al enemigo dentro de una zona 8 veces mas ancha. Si quieres que la bala
# vaya de verdad donde apuntas, juega en la dificultad mas alta.
# ---------------------------------------------------------------------------

