# ---------------------------------------------------------------------------
# torso_hueso   (C-106)   *** ESTE ES EL QUE HAY QUE PROBAR ***
# ---------------------------------------------------------------------------
#
# QUE PARTE DEL CUERPO SE GIRA. Es el ajuste importante, y sale de algo que tu
# dijiste y que el registro confirmo:
#
#   "hay un momento que la camara deja de tener ese movimiento fluido y marea"
#
# La camara del juego va en el hueso de la CABEZA de Max. Y la cabeza cuelga de
# la columna. Asi que al girar la columna, **la camara se desplazaba sola, sin
# que tu te movieras**. Eso es exactamente lo que marea en realidad virtual, y
# lo tenia escrito en la investigacion del candidato anterior: a Boneworks le
# critican justo eso, "la IK le quita la camara al jugador".
#
# La clavicula es de donde cuelga el brazo, y **la cabeza NO cuelga de ella**.
# Girando las dos claviculas, los hombros y los brazos te siguen y la camara no
# se entera de nada.
#
#   2   las dos CLAVICULAS. Los hombros te siguen, la camara no se mueve.
#       Es lo puesto, y es lo que no puede marear.
#   1   la COLUMNA entera. Gira mas cuerpo, pero MUEVE LA CAMARA. Si esto te
#       marea, vuelve al 2.
#   3   la columna alta (de la cintura del pecho para arriba).
#   0   el mod no toca el torso, como antes de todo esto.
#
# SE PUEDE CAMBIAR CON EL JUEGO ABIERTO. Los cuatro, sin cerrar nada.
# APAGADO 2026-08-28. El usuario: *"me marea cuando yo me muevo, el cuerpo se
# queda atras y yo estoy adelante, se dobla todo el cuerpo"*. Puesto a 0 se
# vuelve al estado en que el brazo funcionaba, sin el torso mezclandose con la
# camara.
torso_hueso = 0

