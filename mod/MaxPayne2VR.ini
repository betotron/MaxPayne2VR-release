# ---------------------------------------------------------------------------
# apuntado_lo_manda_el_lector   (C-128)   *** EL CAMBIO DE RUMBO ***
# ---------------------------------------------------------------------------
#
# LO QUE ARREGLA. Mandaste una foto y una pregunta que resulto ser la buena:
#
#   "podras ver el puntero cerca de la puerta. ¿Eso es correcto? Pero mira la
#    posicion del brazo y del arma. No tiene sentido."
#
# Las dos cosas eran ciertas. Leyendo el codigo del juego con Ghidra aparecio
# por que: **la mira y el cuerpo obedecen a dos jefes distintos.**
#
#   - La MIRA la manda el mod desde M4.
#   - Hacia donde apunta el CUERPO se lo pregunta el motor al RATON, cada
#     fotograma, por un camino que no tocabamos.
#
# Por eso cada arreglo del brazo destapaba otro: estabamos maquillando una
# contradiccion en vez de quitarla.
#
# QUE HACE ESTO. Contestarle nosotros a esa pregunta, con **exactamente la
# misma direccion** que se le escribe a la mira. Entonces el motor hace solo
# todo lo demas: gira el cuerpo -y eso son los 360 grados-, coloca la mira,
# mueve los brazos con SU animacion, y dispara hacia ahi.
#
#   0   no se instala nada. El juego queda como si esto no existiera.
#   1   SOLO MIDE. No cambia nada de lo que ves. Sirve para saber si el motor
#       pregunta de verdad por ahi: mira en el registro la linea
#       "APUNTADO ... preguntas=". Si sale 0, este camino no vale.
#   2   MANDAMOS nosotros la direccion.
#   3   y ademas se le fuerza a que SI la pregunta de antes.
#
# LO QUE MIDIO C-128: el gancho quedo puesto en el sitio bueno y el motor **no
# pregunto ni una vez** por la direccion en toda una partida. Leyendo el codigo
# aparecio por que: el motor pregunta ANTES otra cosa -otra casilla del mismo
# lector- y solo si esa dice que si sigue. El modo 3 la fuerza.
#
# SE PUEDE PASAR DE 1 A 2 CON EL JUEGO ABIERTO. Bajar a 0 despues deja de
# mandar, pero el gancho sigue puesto hasta que reinicies -quitarlo contigo
# dentro seria desmontarte el mod a media partida-.
apuntado_lo_manda_el_lector = 1


