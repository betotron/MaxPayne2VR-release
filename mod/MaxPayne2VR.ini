# ---------------------------------------------------------------------------
# ladeo_de_cabeza  (C-063)   *** ES EL CAMBIO DE ESTE CANDIDATO ***
# ---------------------------------------------------------------------------
# EL SINTOMA, con la primera persona ya funcionando: "el movimiento de la camara
# no se siente natural, al mirar, al girar, al asomarse".
#
# LO QUE SE ENCONTRO MIRANDO COMO LO HACEN OTROS, en el CODIGO de HaloCEVR y no
# en su README (`VR/OpenVR.cpp`, `UpdateCameraFrustum`):
#
#     Matrix3 rotationMatrix = GetRotationMatrix(headMatrix);
#     frustum->facingDirection = (rotationMatrix * facing).normalize();
#     frustum->upDirection     = (rotationMatrix * up).normalize();
#
# **No suman angulos: reemplazan la orientacion entera con la matriz del casco,
# ladeo incluido.**
#
# Nosotros sumabamos GIRO (mirar a los lados) y CABECEO (mirar arriba y abajo),
# y **tirabamos el LADEO**. O sea: inclinabas la cabeza hacia el hombro y el
# mundo se quedaba recto. Eso es de las cosas que mas rapido delatan que algo no
# es real, aunque cueste decir que es lo que falla.
#
# Y no es un descuido nuevo: estaba escrito como deuda desde M4, en el propio
# codigo: "el alabeo se descarta a proposito de momento; el motor lo aceptaria,
# pero conviene probarlo por separado". Esto es ese "por separado".
#
# A 0 vuelve a como estaba: ladeas y el mundo no te sigue.
# ---------------------------------------------------------------------------

