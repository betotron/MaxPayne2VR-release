#               matrices de vista: 8083 del mundo      <- 8083 contra 158
#     10:11:13  GIRO: 0 girados, 0 repuestos
#
# Once segundos despues de elegirla ya no era la buena. Con esto, cuando la
# camara atada deja de recalcularse tres segundos seguidos, se busca la nueva y
# se vuelven a atar LAS CINCO cosas -atar solo unas cuantas dejaria media vista
# en una camara y media en otra-.
#
#   1   lo recomendado.
#   0   APAGADO: vuelve a atarse una sola vez, al arrancar.
#
# Se aplica sin reiniciar. En el diario: `CAMARA reatada N veces`.
