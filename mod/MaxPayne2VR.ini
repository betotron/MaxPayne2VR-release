# ---------------------------------------------------------------------------
# camara_desde_el_suelo   (C-168)   *** EL BOTE DE LA CAMINATA ***
# ---------------------------------------------------------------------------
# El usuario: *"el personaje da saltos en su animacion, y eso en realidad virtual
# marea. ¿Cual es la logica mas conveniente: modificar la animacion de la
# caminata, o eliminarla?"*.
#
# NINGUNA DE LAS DOS. El cuerpo tiene que seguir andando como anda —si le quitas
# la animacion, Max se desliza y se ve peor—. Lo que sobra es que **la camara
# cuelgue de un hueso que bota**.
#
# Y es el principio que usan los mods de realidad virtual: *"never apply head-bob
# from animation to the VR camera - apply it to the avatar neck only"*. Los
# desarrolladores de Star Citizen probaron a colgar la camara del hueso de la
# cabeza con captura de movimiento y lo abandonaron porque sentaba muy mal. Este
# mod hacia exactamente eso.
#
# C-123 ya suavizaba el bote, pero **solo la ALTURA**, porque de lado y adelante
# te desplazas de verdad al andar y suavizarlo haria que la caminata llegara
# tarde.
#
# LO QUE LO DESBLOQUEA: `X_Character` exporta `getGroundPosition` —donde PISA
# Max—, y **respecto al suelo, andar no desplaza nada**. `cabeza - suelo` es SOLO
# el bote, sin el viaje. Asi que se puede quitar en los TRES ejes sin retraso
# ninguno. Se le LLAMA, no se parchea nada.
#
# El suavizado sigue siendo el de siempre, ya probado: lo pequeño y rapido se
# alisa, lo grande se sigue al instante. Agacharse y caerse llegan a tiempo.
#
#   1   lo recomendado.
#   0   vuelve a C-123: solo la altura.
#
# Se aplica sin reiniciar. Con `camara_quitar_el_bote` se gradua cuanto.
# --- C-174: AHORA SON TRES OPCIONES, Y SE COMPARAN EN CALIENTE -------------
#
# TU LO DIJISTE: *"estoy totalmente quieto, y la camara hace movimientos
# extraños, involuntarios"*, y *"la caminata volvio a dar saltos"*.
#
# Las dos quejas salen del MISMO numero, y el contador de C-173 lo dejo claro:
#
#     SUELO  126738 creidos, 16782 SOSTENIDOS, 2992 adoptados
#
# **8 adopciones por segundo** (mediana de 354 segundos), y cada una es un salto
# de mas de 30 cm que la camara se traga: ese es el movimiento involuntario. Y el
# **11% de los fotogramas** con el suelo congelado: ahi la resta incluye el viaje
# de andar, el suavizado lo deja pasar por grande, y VUELVE EL BOTE.
#
# O sea que `getGroundPosition` no vale como ancla: es una sonda hacia abajo y
# cambia de superficie constantemente. La idea de C-168 era buena; el punto
# elegido, no.
#
#   0 = la camara de C-123: solo se le quita el bote a la altura.
#   1 = colgada del SUELO (C-168). Es la que daba los 8 tirones por segundo.
#   2 = colgada del CUERPO de Max (C-174). Se mueve con el, no bota -el bote vive
#       en el esqueleto, no en el objeto- y no sale de ninguna sonda.
#
# Los tres se cambian CON EL JUEGO ABIERTO. Si quieres comparar, pon 0, luego 2,
# y quedate con lo que mejor sientas: eso cuesta segundos en vez de partidas.
camara_desde_el_suelo = 2

