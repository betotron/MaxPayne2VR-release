# LO DESCRIBISTE EXACTO:
#
#   "Yo camino hacia el frente, camina al frente. Pero si yo muevo mi cabeza y
#    apunto a otro lado y me muevo hacia el frente, ya no estoy caminando de
#    frente, me estoy yendo a la derecha."
#
# La palanca se giraba **todo** lo que hubieras girado la cabeza, para que
# "adelante" fuera adelante para ti. Eso era correcto cuando Max no giraba nunca.
#
# Desde que el cuerpo gira contigo, **el cuerpo ya se ha llevado parte de ese
# giro**, asi que descontarlo entero lo cuenta DOS VECES. De ahi que andar de
# frente te tirara hacia un lado.
#
# Ahora se descuenta solo lo que tu cabeza esta girada **respecto a Max**, que es
# el mismo numero que ya usa el giro del cuerpo. Un solo sitio, no dos copias.
#
#   1   andar de frente es de frente, gire lo que gire el cuerpo (lo puesto)
#   0   como estaba
#
# SE PUEDE CAMBIAR CON EL JUEGO ABIERTO.
andar_descuenta_el_giro = 1


# ---------------------------------------------------------------------------
# tu_paso_anda   (C-145)   *** LO QUE LLEVAS PIDIENDO ***
# ---------------------------------------------------------------------------
#
#   "Me muevo y me salgo del cuerpo... pensé que este torso me iba a seguir a
#    todas partes, junto con el movimiento que yo realizo en la vida real. La
#    idea es que el cuerpo siempre quede pegado a mí, no importa si en la vida
#    real yo me movi un par de centimetros."
#
# Hasta ahora, cuando dabas un paso se movia la CAMARA y Max se quedaba. El unico
# freno era un tope, que no es seguirte: es ponerte una pared invisible.
#
# Esto es el mismo mecanismo que ya funciona dos veces: tu giro empuja el raton y
# Max gira; **tu paso empuja la palanca y Max anda**.
#
# La palanca de verdad MANDA: si la estas tocando, tu paso no interfiere.
#
#   0   Max no te sigue (lo puesto)
#   1   das un paso de verdad y Max anda contigo
# 2026-08-28: ENCENDIDO. Estaba a 0 desde C-145 por descuido -se construyo para
# esto y nunca se activo-. Se encendio en caliente a las 23:36:21 despues de
# medir que al usuario se le recortaban hasta 63 cm de cada paso: se movia 0.88 m
# y a Max solo le llegaban 0.25. Jugo asi el resto de la sesion y dijo *"pude
# jugar bastante bien, pase el nivel"*, pero eso NO es una confirmacion de este
# ajuste en concreto y no se ha podido medir -el diario se quedo sin cupo 15
# segundos despues de encenderlo-. Se deja a 1 para no apagarle en silencio algo
# con lo que estaba jugando bien.
tu_paso_anda = 1

# Cuanto te puedes mover sin que Max se entere. Inclinarse a mirar algo no es
# andar, y con esto en 0,15 no lo es.
paso_holgura_metros = 0.15

# ---------------------------------------------------------------------------
# paso_recuperar_por_segundo   (C-145)
# ---------------------------------------------------------------------------
#
# ESTE NUMERO NO ESTA MEDIDO, Y LO DIGO CLARO. Deberia ser lo que Max anda por
# segundo, y no se ha podido medir todavia.
#
# POR QUE HACE FALTA: que Max ande no acerca tu cabeza al centro de tu
# habitacion -tu paso es fisico, el juego no te mueve a ti-. Asi que mientras Max
# anda, el punto neutro avanza hacia ti. Asi el desplazamiento se cierra, la
# orden de andar se apaga sola, y la vista no da un salto.
#
# EL SINTOMA SI ESTA MAL: al dar un paso notaras que **el suelo resbala** -que
# Max se mueve mas o menos de lo que te has movido tu-.
#
#   si Max se pasa de largo  -> SUBE este numero
#   si Max se queda corto    -> BAJALO
#
# SE CAMBIA CON EL JUEGO ABIERTO.
paso_recuperar_por_segundo = 0.60

# ---------------------------------------------------------------------------
# EL MENU CON LA PALANCA   (C-178)
# ---------------------------------------------------------------------------
#
# Lo pediste asi: *"que yo con los joystick pueda tener acciones... que pueda
# mover el joystick, el mouse del juego, solo en los menus"*, y elegiste **«El
# joystick mueve el cursor»**.
#
# COMO SE SABE QUE ESTO VA A FUNCIONAR, SIN ABRIR EL JUEGO
#
# En C-124 se engancho el teclado del menu a ciegas: quedo puesto y el motor no
# pregunto ni una vez. Una partida perdida. Esta vez se miro primero **quien le
# pide que al raton**, en la tabla de importaciones del propio juego. El modulo
# donde vive el menu -`X_BasicModesMFC.dll`- pide exactamente cuatro cosas:
#
#     getMouse, isSingleClicked, isPressed, getPositionRelativeNoInvert
#
# Y lo confirma tu propia partida del 31 de agosto: el contador del giro
# -`getPositionRelative`, que es OTRA funcion- se quedo clavado en 57455
# mientras estabas en el menu. El menu lee otra puerta, y ahora se sabe cual.
#
# **Esto no puede afectar a la partida.** Solo se toca la casilla del modulo del
# menu; la de `maxpayne2.exe` se queda intacta.
#
#   menu_cursor_con_la_palanca   1 = encendido. A 0 no se parchea NI UNA casilla.
#                                ESTE es el unico que necesita reiniciar el juego,
#                                porque instala ganchos. Los otros cinco no.
#   menu_cursor_mano             0 = la palanca izquierda, 1 = la derecha.
#   menu_cursor_velocidad        pixeles por fotograma con la palanca a fondo,
#                                sobre la pantalla de 640x480 del menu. Con 9 el
#                                cursor cruza la pantalla en poco mas de un
#                                segundo. Si te va lento, sube; si se te escapa,
#                                baja.
#   menu_cursor_zona_muerta      cuanto hay que empujar para que empiece a moverse.
#                                Si el cursor se va solo, sube este numero.
#   menu_cursor_invertir_y       0 normal. **Si empujas arriba y el cursor BAJA,
#                                pon 1** y se arregla sin cerrar el juego.
#   menu_cursor_boton            que boton hace clic:
#                                  0 = gatillo        (el de disparar)
#                                  1 = boton A / X
#                                  2 = agarre
#                                  3 = boton B / Y
#                                  4 = apretar la palanca
#                                Hay botones que Virtual Desktop se queda antes de
#                                que lleguen al juego -el de las tres rayitas, la
#                                X-, y desde dentro eso se ve igual que un fallo.
#                                Por eso se puede cambiar aqui, en caliente.
#
# RECHAZADO POR EL USUARIO EL 2026-08-31, antes de probarlo y por diseño:
#
#   *"Es estupido mover los controles para mover el mouse. Mejor usamos el
#    joystick izquierdo con los botones arriba, abajo, para ir cambiando entre
#    menu y algun boton para hacer clic."*
#
# Tiene razon. Lo que hace eso es C-179, aqui abajo. Esto se queda APAGADO y
# entero por si algun dia hiciera falta un cursor de verdad.
#
# LOS CINCO DE ABAJO SE CAMBIAN CON EL JUEGO ABIERTO. El primero no.
menu_cursor_con_la_palanca = 0
menu_cursor_mano = 1
menu_cursor_velocidad = 9.0
menu_cursor_zona_muerta = 0.20
menu_cursor_invertir_y = 0
menu_cursor_boton = 0

# ---------------------------------------------------------------------------
# EL MENU POR PASOS   (C-179)
# ---------------------------------------------------------------------------
#
# Tu pediste esto: *"usamos el joystick izquierdo con los botones arriba, abajo,
# para ir cambiando entre menu y algun boton para hacer clic"*.
#
# POR QUE ESTO NO ES C-115 OTRA VEZ. C-115 ya lo hacia, y no funciono NUNCA. El
# registro dijo lo mismo siete sesiones seguidas:
#
#     TECLADO casillas=2  preguntas=0  dijimos si=0  pasos de menu=0
#
# El gancho puesto, y el juego sin preguntar ni una vez. Ahora se sabe por que:
# **el menu no mira si una tecla esta pulsada, VACIA UNA COLA de teclas**. Son
# dos mecanismos distintos y solo uno es el bueno.
#
# Y las teclas del menu son las de Windows -arriba es 0x26-, no las de
# DirectInput -arriba es 0xC8-, que eran las que se le mandaban. Se leyeron una
# a una en el propio codigo del menu.
#
# EL INTERRUPTOR ES `menu_con_los_mandos`, que ya existia mas arriba.
#
#   menu_mano_de_la_palanca   0 = la palanca IZQUIERDA mueve el menu, 1 = la derecha.
#   menu_boton_aceptar        que boton elige la opcion:
#                               0 = gatillo   1 = boton A / X   2 = agarre
#                               3 = boton B / Y   4 = apretar la palanca
#                             **Vale el de CUALQUIERA de las dos manos**, para que
#                             «lo apreté y no pasó nada» no pueda ser por haber
#                             cogido el mando equivocado con el casco puesto.
#   menu_boton_atras          el que vuelve a la pagina anterior. Por defecto B/Y.
#   menu_espera_ms            si mantienes la palanca, lo que tarda en empezar a
#                             repetir. Sube si se te pasa de opcion.
#   menu_repite_ms            y cada cuanto salta despues.
#
# La palanca tambien va a IZQUIERDA y DERECHA: en este menu eso cambia el VALOR
# de una opcion (el volumen, la resolucion...).
#
# LOS CINCO SE CAMBIAN CON EL JUEGO ABIERTO.
menu_mano_de_la_palanca = 0
menu_boton_aceptar = 0
menu_boton_atras = 3
menu_espera_ms = 400
menu_repite_ms = 150

# ---------------------------------------------------------------------------
# menu_raton_quieto   (C-181)
# ---------------------------------------------------------------------------
#
# Tu lo viste: *"si puedo mover el mouse con los joysticks, pero se mueve de
# forma loca"*. Ese movimiento **no lo hacemos nosotros** -el cursor de C-178
# quedo rechazado y esta apagado-: lo mete Virtual Desktop, que convierte el
# mando en raton por su cuenta.
#
# Y estorba de una forma muy concreta, leida en el codigo del menu: **si el raton
# se ha movido, el menu vuelve a marcar la opcion que este bajo el puntero**. O
# sea que el puntero deshace cada flecha nada mas darla, y desde fuera eso se ve
# igual que «las flechas no funcionan».
#
# Con esto a 1, en el menu se le devuelve CERO de movimiento. **Los botones no se
# tocan**: el clic del raton fisico sigue funcionando, asi que si algo fallara no
# te quedas encerrado en el menu.
#
# C-182: Y SOLO SE CALLA MIENTRAS EL MANDO PUEDA MOVER EL MENU.
#
# La primera version callaba el raton siempre, y te dejo sin las dos cosas: *"el
# puntero esta quieto, ni se mueve con los joysticks ni con el mouse. No puedo
# subir ni bajar ni nada."* Pasaba porque en el MENU DE ARRANQUE el mod todavia
# no tiene mandos —la sesion de realidad virtual se monta al entrar en la
# partida—, asi que te quitaba el raton sin darte las flechas a cambio.
#
# Ahora el raton se calla **dentro** del mismo sitio que empuja las flechas. Si
# ese sitio no corre, tu raton no se toca. No hay forma de quedarse sin las dos.
#
# SI PREFIERES MOVERTE CON EL PUNTERO, ponlo a 0. Se cambia con el juego abierto.
menu_raton_quieto = 1

# ---------------------------------------------------------------------------
# EL MENU EN UNA PANTALLA, NO PEGADO A LA CARA   (C-183)
# ---------------------------------------------------------------------------
#
# Tu, en cuanto el menu empezo a funcionar: *"el menu esta muy pegado a la camara
# de realidad virtual. Lo veo extremadamente grande, y me cuesta hacer
# acciones."*
#
# Pasaba porque la imagen se le entrega al casco ocupando TODO el campo de
# vision. Para el mundo eso es lo correcto; para una pantalla plana con letras es
# como leer un cartel con la nariz pegada.
#
# Con esto, mientras el menu esta abierto la imagen se cuelga delante de ti como
# una pantalla plana, del tamaño que tu digas, y el resto en negro. Se mueve
# contigo, asi que no puedes perderla de vista.
#
#   menu_pantalla_de_cine    1 = encendido. A 0 se ve como antes.
#   menu_pantalla_grados     **ESTE es el tamaño.** Cuantos grados ocupa de ancho.
#                              30 = un monitor de escritorio
#                              45 = comodo para leer  (por defecto)
#                              60 = pantalla de cine
#                              90 = grande, se lee peor de reojo
#   menu_pantalla_distancia  a que distancia se pone, en metros. **NO cambia el
#                            tamaño que percibes**: si la alejas, se hace mas
#                            grande en la misma proporcion. Sirve para que no se
#                            te meta entre los objetos. Con 2 metros basta.
#   menu_pantalla_altura     subirla o bajarla respecto a donde miras, en metros.
#                            Positivo la sube. 0 = justo donde miras.
#
# LOS CUATRO SE CAMBIAN CON EL JUEGO ABIERTO: abre el menu, cambia el numero,
# guarda el archivo, y lo ves al momento sin cerrar nada.
menu_pantalla_de_cine = 1
menu_pantalla_grados = 45
menu_pantalla_distancia = 2.0
menu_pantalla_altura = 0.0

# ---------------------------------------------------------------------------
# Y QUE NO TE SIGA   (C-184)
# ---------------------------------------------------------------------------
#
# Tu: *"el menu esta como pegado a la camara. Si yo muevo la cabeza, el menu me
# sigue y eso me marea. La idea es que yo pueda mover mi cabeza y el menu se
# quede quieto."*
#
# Ahora la pantalla se clava **donde estabas mirando al abrir el menu**, y ahi se
# queda: mueve la cabeza y no te sigue. Al cerrar y volver a abrir el menu,
# vuelve a aparecer delante de ti.
#
#   menu_pantalla_sigue_a_la_cabeza    0 = se queda quieta (lo normal)
#                                      1 = te sigue, que es lo que te mareaba
#
#   menu_pantalla_vuelve_a_los_grados  el seguro para no perderla. Si te giras
#                                      mas que esto, se recoloca delante — y como
#                                      para entonces ya esta fuera de tu vista,
#                                      **no la ves moverse**: solo notas que al
#                                      girarte, esta.
#                                      55 es un poco mas de media pantalla.
#                                      Ponlo en 999 para que no se recoloque nunca.
#
# LOS DOS SE CAMBIAN CON EL JUEGO ABIERTO.
menu_pantalla_sigue_a_la_cabeza = 0
menu_pantalla_vuelve_a_los_grados = 25

# ---------------------------------------------------------------------------
# menu_pantalla_vuelve_a_los_metros   (C-187)
# ---------------------------------------------------------------------------
#
# Tu: *"aunque yo mire de frente, esta por debajo, casi a mis pies"*.
#
# La pantalla se clava en el primer fotograma en que aparece, y en ese instante
# el casco puede dar una posicion **que dice ser buena y no lo es**. En tu
# registro se ve, con 32 milesimas entre las dos lineas:
#
#     12:25:03.095   cabeza en   0.000  -1.499   0.000
#     12:25:03.127   cabeza en   0.090   0.082   0.468
#
# Metro y medio por debajo. La pantalla se clavo ahi, y ahi se quedo.
#
# Ahora, si el sitio donde se clavo esta a mas de estos metros de tu cabeza, se
# da por malo y se vuelve a clavar. Se arregla solo, sin fiarse de nada.
#
# Y de paso: **si te levantas de la silla, la pantalla te acompaña** en vez de
# quedarse a la altura de donde estabas sentado.
#
#   0.6 = un poco mas de lo que cambia tu cabeza al asentir o recostarte
#   999 = no se recoloca nunca (y vuelves al defecto de antes)
#
# SE CAMBIA CON EL JUEGO ABIERTO.
menu_pantalla_vuelve_a_los_metros = 0.6

# ---------------------------------------------------------------------------
# LA REALIDAD VIRTUAL DESDE EL PRIMER SEGUNDO   (C-185)
# ---------------------------------------------------------------------------
#
# Tu: *"la idea es replicar esto desde el dia uno que abrimos y entramos al
# juego, entrar en modo realidad virtual y tener todo esto asi"*.
#
# Hasta la v1.0.2 el casco se montaba **al entrar en la partida**, no al abrir el
# juego. Por eso el menu principal no tenia ni casco ni mandos: el mod estaba
# esperando a que el motor empezara a simular, y en un menu el motor no simula
# nunca. Se descubrio con un contador que decia `MANDO atendido=0`.
#
# Ahora el casco se monta nada mas existir la ventana del juego. Lo que necesita
# de verdad al motor —el censo de camaras, el cono, el estereo— sigue esperando,
# porque un menu no lo necesita: se enseña en una pantalla plana.
#
# Y hay una red de seguridad que ademas mejora el resto: **mientras no se sepa el
# cono de la camara del juego, todo se enseña plano.** Antes, sin cono, se
# declaraba el del casco, y eso es justo lo que hacia VER DOBLE. Una pantalla
# plana no marea.
#
# A 0 se vuelve al orden de la v1.0.2: el casco al entrar en la partida.
# ESTE NO se relee en caliente: decide el orden del arranque.
casco_desde_el_arranque = 1
