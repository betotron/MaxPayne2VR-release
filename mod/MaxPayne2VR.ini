# direccion de REFERENCIA. Y esa referencia era **la postura en reposo de Max**,
# que es una direccion fija: apuntando cerca de ella sale bien -ese es tu punto
# dulce- y cuanto mas te alejas, mas rueda el arma. A noventa grados, acaba
# vertical.
#
# Ahora la referencia es **arriba de verdad**. Una persona que apunta a
# cualquier sitio mantiene el arma recta respecto al suelo, y eso no depende de
# hacia donde apunte.
#
#   1   el arma se queda recta apuntes donde apuntes (lo puesto)
#   0   como estaba
