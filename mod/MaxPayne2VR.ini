# ---------------------------------------------------------------------------
# DONDE SE VE LA FILA DE ARMAS   (C-216)
# ---------------------------------------------------------------------------
#
# Tu: *"solo puedo ver el cambio de armas cuando estoy mirando de frente; si mis
# manos estan en otra posicion o estoy mirando a otro lado, no lo veo"*.
