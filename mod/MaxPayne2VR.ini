#
#     camara = suelo + suavizado(cabeza - suelo)
#
# La idea estaba bien -y por eso caminar mejoro-, pero **el suelo se sumaba en
# crudo**. Y "donde pisa Max" no es una altura tranquila: es lo que hay debajo,
# y cambia de golpe al pasar por un escalon, un bordillo, una caja o un hueco.
#
# En tu registro, la distancia del arma al suelo -que deberia ser casi constante,
# porque el arma va en tu cuerpo- saltaba entre **0,93 y 3,50**, y en otra sesion
# se le vio en **44,83**. Cada uno de esos saltos entraba entero en la camara.
