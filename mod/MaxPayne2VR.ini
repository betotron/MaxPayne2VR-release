# LO DEMOSTRARON TUS TRES CAPTURAS. El mod estimaba tu hombro **justo debajo de
# tu cabeza**, y midiendo TU MISMO BRAZO en tres posturas salian tres numeros
# que no pueden ser el mismo brazo:
#
#                             brazo abajo  apuntando  postura en T
#   hombro debajo (lo malo)      0.634       0.604       0.862
#   hombro 20 cm al lado         0.572       0.572       0.662
#
# Con el hombro en su sitio, dos de las tres coinciden EXACTAMENTE, y la de la T
# queda como la mayor -que es lo que tiene que ser, porque en T el brazo esta del
# todo estirado-.
#
# Y esto es lo que rompia el brazo: en postura de T se le pedia a Max llevar la
# mano al **110% de su brazo**, o sea fuera de alcance. Ahi la cadena no tiene
# solucion posible y saca posturas extremas.
#
# Es una medida de TU cuerpo. Si lo notas raro, subelo o bajalo un par de
# centimetros; se cambia con el juego abierto.
brazo_hombro_al_lado = 0.20


# ---------------------------------------------------------------------------
# brazo_quitar_el_bote   (C-200)   *** LO VISTE TU AL CAMINAR ***
# ---------------------------------------------------------------------------
#
# TUS PALABRAS: *"Cuando estoy caminando, el arma se desplaza. Solo cuando estoy
# caminando. El punto de mira sigue correcto; hay una animacion del arma que se
# desplaza."*
#
# MEDIDO, con tus dos fotos de la tecla `L` separadas 0,92 segundos mientras
# caminabas (08:49:39). Todo en los ejes de Max, o sea SIN nada de lo que andas:
#
#     hueso                se movio (x=derecha, y=arriba, z=adelante)   total
#     Bip01 Spine           -0.002   +0.087   +0.000                   0.087 m
#     Bip01 R Clavicle      +0.008   +0.083   +0.030                   0.089 m
#     Bip01 R UpperArm      +0.008   +0.081   +0.051                   0.096 m
#     Bip01 R Gun           +0.031   +0.108   +0.061                   0.128 m
#     TU MANO (la tuya)     +0.016   +0.031   +0.024                   0.042 m
#
# EL CUERPO ENTERO SUBE 8,7 CM, de la columna al arma. De lado se mueve 0,8 cm.
# O sea que el balanceo del paso es **vertical**, no lateral, y mide unos 9 cm
# por zancada. Tu mano, mientras tanto, se movio 4,2 cm: el arma se movio TRES
# VECES lo que tu.
#
# Y ese bote **a la camara se le quita a proposito** desde C-123, porque en el
# casco marea. Al arma no se le quitaba. Asi que el arma sube y baja 9 cm
# delante de unos ojos que estan quietos, y eso es lo que ves.
#
# QUE HACE ESTO. El mismo filtro de la camara, aplicado al sitio al que va tu
# mano. Las oscilaciones pequeñas -el paso- desaparecen; las grandes -agacharse,
# caer, una escalera- pasan al instante, igual que en la camara.
#
# LO QUE NO TOCA: de donde SALE el brazo. Ese hombro bota de verdad y tiene que
# botar, o el brazo saldria de un sitio donde no esta. Son dos cosas distintas
# y confundirlas fue lo que se rechazo en C-111.
#
#   0.15  lo puesto, el mismo numero que la camara
#   0     apagado: no se toca nada del brazo (queda como C-199)
#   1     no suaviza nada (igual que apagado, pero con el filtro montado)
#
# SE PUEDE CAMBIAR CON EL JUEGO ABIERTO.
#
# OJO CON EL ALCANCE. Quitarle el bote a donde va la mano pide un poco mas de
# brazo: el hombro sube 8 cm y la mano no, asi que el brazo tiene que estirarse
# esos 8 cm. En tu partida el alcance andaba entre 0,20 y 0,82 de 1, asi que
# cabe. Si alguna vez no cabe, se vera en la linea `SONDA BRAZO` del registro,
# que ahora lleva el bote quitado **al lado** del alcance.
# C-202: 0,15 SE RECHAZO Y SE ENTIENDE POR QUE. Ese numero venia de la camara, y
# a 50 fps solo quita el **26,5%** de un balanceo de zancada (~1,1 Hz): el filtro
# es ocho veces demasiado rapido para lo que hay que quitar. El mecanismo estaba
# bien; el numero, no.
#
# MEDIDO en sus dos fotos del 09:15 -una andando adelante, otra atras-:
#
#     Bip01 R UpperArm (el hombro)  se movio  0.247 m
#     Bip01 R Clavicle              se movio  0.132 m
#     Bip01 Spine (la raiz)         se movio  0.070 m
#     SU mano                       se movio  0.100 m
#     lo que se le PIDE a Max:  0.437 m  contra  0.440 m   <- IDENTICO
#
# O sea: el brazo de Max hace exactamente la misma forma, y lo que se mueve 25 cm
# es su RAIZ. Es el balanceo del brazo de la animacion de andar, y hacia atras esa
# animacion casi no balancea. Por eso solo pasa yendo hacia adelante.
#
# 0,03 quita el 78,8% de ese balanceo y deja la constante de tiempo en 0,67 s.
# TU mano NO se filtra -eso va por otro lado y responde al instante-; lo unico que
# se amortigua es el vaiven del hombro de Max.
#
# OJO CON EL ALCANCE: con el ancla casi quieta, el brazo tiene que absorber el
# vaiven (unos +-12 cm). Mira `alcance` en la linea SONDA BRAZO: si se acerca a
# 1,00 o aparece `mano fuera de alcance`, este numero es demasiado bajo.
brazo_quitar_el_bote = 0.03


# ---------------------------------------------------------------------------
# culatazo_segundos   (C-203)   *** LO PEDISTE TU ***
# ---------------------------------------------------------------------------
#
# TUS PALABRAS: *"La pistola Beretta, se supone que cuando disparo debe hacer un
# retroceso, pero esa animacion no la tiene. Analiza que sucedio con las
# animaciones de las armas. O yo estoy mal."*
#
# NO ESTABAS MAL. Y la causa se leyo en el disco, sin gastar una partida:
#
#   1. En este motor el retroceso NO es un efecto aparte que se pueda encender.
#      Es una ANIMACION DE HUESOS, una por arma. El guion del propio juego
#      (`MP2_Init.ras`) declara 708 animaciones de personaje, y entre ellas:
#
#          CHARANIM_SHOOTBERETTA      CHARANIM_SHOOTHIGHBERETTA
#          CHARANIM_SHOOTBERETTADUAL  CHARANIM_SHOOTLOWBERETTA   ...
#
#      La palabra RECOIL no aparece NI UNA VEZ en todo el guion.
#
#   2. Y el mod escribe esos mismos huesos —los dos brazos enteros— en los cinco
#      momentos de cada fotograma. 31752 veces en una sola partida tuya.
#
#   3. Quien gana se sabe sin medirlo: tu brazo sigue a tu mando, luego nuestra
#      escritura es la ultima, luego la animacion se borraba antes de verse.
#      Y con ella la de recargar y la de cambiar de arma.
#
# QUE HACE ESTE NUMERO. Los segundos que, despues de cada disparo, el brazo se
# le DEVUELVE al motor para que se vea su animacion. Mientras dura, el brazo
# hace lo que dice la animacion y no lo que hace tu mano —que es exactamente lo
# que es un retroceso—.
#
#   0.20  un culatazo corto, lo puesto
#   0.35  mas largo y mas teatral
#   0     apagado: el mod no suelta el brazo nunca y queda como antes
#
# SE PUEDE CAMBIAR CON EL JUEGO ABIERTO.
#
# Se suelta la cadena ENTERA -hombro, codo y mano, los dos brazos- o no se
# suelta nada. Un hueso escrito y otro no seria peor que ninguno: la mano
# heredaria el giro del codo animado y el arma acabaria en cualquier sitio.
#
# EN EL REGISTRO, la linea `CULATAZO` lleva dos numeros que distinguen las dos
# averias posibles: `disparos vistos=0` seria que no nos llega el gatillo, y
# `disparos>0` con `se le ha dejado al motor 0 veces` seria que falla esto.
# RECHAZADO EN C-203 Y APAGADO. La animacion existe y se ve -el usuario la
# vio-, pero es una POSE ENTERA de los dos brazos, no un culatazo: *"eso hace
# perder la inmersion y la direccion donde realmente estoy apuntando, porque
# despues cambia la animacion a un punto especifico"*. Y sobre todo: *"no me da
# control de las manos una vez que disparo"*. El retroceso lo haremos nosotros,
# subiendo el arma unos grados sin quitarle el control. Revertir es desactivar,
# no borrar: el codigo se queda dormido.
culatazo_segundos = 0


# ---------------------------------------------------------------------------
# apuntado_cada_gatillo_su_mano   (C-205)   *** LO PEDISTE TU ***
# ---------------------------------------------------------------------------
#
# TUS PALABRAS: *"Tengo joystick izquierdo, joystick derecho. Actualmente el
# derecho es el que controla las armas y el gatillo para disparar. Me interesa
# que si tengo dos armas, el joystick izquierdo y su gatillo funcione por
# separado con el arma que tiene en esa mano. De lo contrario, no tiene ningun
# sentido lo que estamos hablando."*
#
# LO QUE MEDISTE TU, con dos Ingram: *"la mano derecha es la que manda; aunque
# tenga la mano izquierda totalmente aparte, todos los tiros salen de donde
# apunta la derecha"*. Y el motor te da la razon: en su propia base de datos un
# arma dual es UNA arma —`INGRAMDUAL_SHOOTINGFREQUENCY`, `INGRAMSHARED_CLIPSIZE`—
# con **una sola direccion de tiro** y **un solo punto de mira**.
#
# QUE HACE ESTO. Esa unica direccion la escribimos NOSOTROS cada fotograma, y
# hasta ahora salia siempre del mando derecho. Con esto sale **del mando que
# este apretando el gatillo**:
#
#     aprietas el gatillo DERECHO    -> las balas van donde apunta tu derecha
#     aprietas el IZQUIERDO          -> las balas van donde apunta tu izquierda
#     los DOS a la vez               -> manda el que ya estaba mandando
#     ninguno                        -> se queda donde estaba, sin saltos
#
# LO QUE NO DA, Y HAY QUE SABERLO. Las dos armas **no pueden disparar a sitios
# distintos A LA VEZ**: la direccion es una sola y no hay forma de tener dos sin
# escribir un sistema de proyectiles entero. Un gatillo cada vez, si.
#
# POR QUE CON LOS DOS APRETADOS NO CAMBIA. Porque elegir cada fotograma haria
# saltar la punteria entre las dos manos sesenta veces por segundo, que es
# exactamente el defecto que ya describiste en C-195: *"a veces aparece en el
# pecho, a veces en el hombro; no tiene ningun sentido"*. Ese temblor lo
# fabricaria el mod.
#
#   1   cada gatillo apunta con su mano   <<< LO PUESTO
#   0   como antes: apunta siempre la derecha
#
# SE PUEDE CAMBIAR CON EL JUEGO ABIERTO. Y no toca el arsenal, ni crea balas, ni
# engancha nada nuevo: solo elige de que mando se lee un angulo que ya se leia.
#
# EN EL REGISTRO, la linea `QUIEN APUNTA` lleva los fotogramas con cada mano por
# separado. Si `con la IZQUIERDA` se queda en 0, es que no nos llega tu gatillo
# izquierdo, que es otra averia y otro sitio.
apuntado_cada_gatillo_su_mano = 1


# ---------------------------------------------------------------------------
# brazo_arma_sigue_a_su_mano   (C-206)   *** LO CAZASTE TU PROBANDO C-205 ***
# ---------------------------------------------------------------------------
#
# TUS PALABRAS: *"Si apunto con la izquierda y disparo, la que manda es la mano
# izquierda, pero tambien mueve el arma de mi mano derecha. No tiene sentido.
# No que yo mueva mi arma a un lado, dispare, y la otra me sigue."*
#
# TENIAS RAZON, Y LA CAUSA ESTABA A LA VISTA. Al orientar la mano, el mod leia
# `LeerElApuntado`, que devuelve **la punteria unica** —la que decide donde van
# las balas—. Las DOS manos se orientaban a esa misma direccion, asi que mover
# una movia la otra. Un defecto nuestro, no del motor.
#
# QUE HACE ESTO. Cada arma se orienta a SU mando:
#
#   1   el arma derecha mira a tu mano derecha, la izquierda a la izquierda
#   0   como antes: las dos miran a la punteria compartida
#
# LO QUE NO TOCA. La punteria compartida sigue igual, y sigue decidiendo donde
# van las balas. Eso es del motor y no se puede duplicar: en su base de datos un
# arma dual es UNA arma. Aqui solo se decide hacia donde se DIBUJA cada arma.
#
# O sea: con esto, **las dos armas dejan de seguirse la una a la otra**. Lo que
# todavia no da es que disparen a sitios distintos A LA VEZ.
#
# SE PUEDE CAMBIAR CON EL JUEGO ABIERTO.
#
# EN EL REGISTRO, la linea `ARMA A SU MANO` dice cuantas veces cada arma ha
# podido usar su propia mano y cuantas no.
brazo_arma_sigue_a_su_mano = 1

# ---------------------------------------------------------------------------
# brazo_hombro_gira_contigo   (C-169)   *** EL PUNTO DULCE ***
# ---------------------------------------------------------------------------
#
# LO QUE TU DESCRIBISTE, tres veces y con las mismas palabras: *"existe un punto
# dulce donde puedo ver el arma de forma perfecta... pero yo giro y despues
# apunto y los brazos se van de posicion. Dejo de tener ese punto dulce"*.
#
# El brazo cuelga de tu hombro. Como tu hombro no lleva sensor, el mod lo estima
# a partir del casco: 21 cm por debajo y 20 cm al lado. Y ese "al lado" estaba
# escrito en los ejes de TU HABITACION, que no giran cuando tu giras. Asi que el
# mod te colocaba el hombro siempre hacia el mismo rincon del cuarto, mirases a
# donde mirases.
#
# La foto de tu tecla L lo enseña clavado:
#
#     tu cabeza = 0.052 -0.153 -0.298
#     tu hombro = 0.252 -0.365 -0.298     <- cabeza + 0.200 en X, siempre
#
# CUANTO SE EQUIVOCABA, segun lo girado que estuvieras:
#
#       0 grados  ->  0.00 m    <-- TU PUNTO DULCE. Aqui no fallaba nada.
#      45 grados  ->  0.15 m
#      90 grados  ->  0.28 m
#     180 grados  ->  0.40 m
#
# Y a Max se le pide llevar la mano a entre 0,26 y 0,42 m del hombro. O sea que
# girando 90 grados **el error era mayor que el brazo entero**: la cadena se
# quedaba sin solucion y sacaba posturas extremas.
#
# Tu punto dulce no era una sensacion. Era el unico angulo donde esto valia
# cero.
#
#   1 = tu hombro gira contigo (lo correcto)
#   0 = clavado a la habitacion, como hasta C-168
#
# Se cambia con el juego abierto. Con 0 vuelve exactamente el comportamiento de
# antes, por si quieres comparar.
brazo_hombro_gira_contigo = 1


# ---------------------------------------------------------------------------
# mira_sale_del_arma   (C-172)   *** EL PUNTO DE MIRA ***
# ---------------------------------------------------------------------------
#
# LO QUE TU DESCRIBISTE: *"cuando hay objetos cercanos, cajas, contenedores, no
# me deja apuntar a la persona que veo detras del objeto; le veo el torso y la
# cabeza, pero el punto de mira nunca llega hasta el"*. Y antes: *"pasa con
# objetos cercanos"*.
#
# EL PORQUE, leido en el codigo del juego (no supuesto):
#
#   · `update2DAiming` le pasa al punto de mira, como punto de partida, la
#     posicion del OBJETO DE MAX -su cuerpo-.
#   · `X_Crosshair::update` tira una linea desde ahi en la direccion que
#     nosotros le damos, y donde choca, ahi se dibuja la mira.
#   · Pero la BALA sale de otro sitio: `getShootingStartPosition` pregunta al
#     esqueleto por el hueso de la linea de fuego. O sea, del arma.
#
# Dos rayos con la misma direccion y origenes distintos se juntan en el
# infinito y se separan cuanto mas cerca esta el blanco. En el juego original
# Max lleva el arma pegada al pecho y no se nota; con el arma en TU mano, a
# medio metro y a otra altura, se separan decenas de grados de cerca.
#
# Y con una caja delante es peor que un desvio: **el rayo choca con la caja**
# aunque tu y el arma veais al enemigo por encima. Por eso "nunca llega".
#
# MEDIDO en tu partida (C-171): el arma esta a **0,57 m** del punto del cuerpo
# desde el que se tira el rayo, y ese numero salio constante en 105 medidas.
#
#   1 = el rayo de la mira sale del arma
#   0 = como antes (y entonces NO SE INSTALA NADA)
#
# OJO: esto se puede APAGAR con el juego abierto, pero no ENCENDER: el gancho
# solo se pone al arrancar. El registro te lo dice si lo intentas.
mira_sale_del_arma = 1


# ---------------------------------------------------------------------------
# mira_salto_maximo   (C-172)
# ---------------------------------------------------------------------------
#
# El freno de mano. El origen de la mira solo se mueve si el arma cae a menos de
# estos metros de donde el motor iba a ponerlo. Si algo saliera mal y el arma
# apareciera en la otra punta del mapa, la mira **no se toca** y el registro lo
# cuenta como `rechazadas`.
#
# Sirve ademas para reconocer el cuerpo de Max sin adivinar ningun offset: es su
# posicion la unica que cae al lado del arma.
mira_salto_maximo = 2.0


# ---------------------------------------------------------------------------
# mira_carrusel_segundos / mira_carrusel_espera   (C-190)   *** EL PUNTO DE MIRA ***
# ---------------------------------------------------------------------------
#
# LO QUE TU DESCRIBISTE: *"si muevo los brazos apuntando a zonas lejanas o
# objetos cercanos, el punto de mira se va por otro lado o choca con objetos y
# desaparece"*.
#
# Y despues, cuando te propuse cambiar un numero aqui con el juego abierto:
# *"Yo no voy a editar ningun documento. Tenlo listo y preparado, y yo te dire
# si lo vi o no. Yo no voy a tocar nada."* Tienes razon. Asi que **lo cambia el
# mod solo**.
#
# QUE HACE. Cada tantos segundos el mod alterna las dos unicas opciones que hay
# para el origen del rayo, y lo anota en el registro con su propia hora:
#
#   mitad 1   EL RAYO SALE DEL ARMA    (lo de ahora, C-172, que aceptaste)
#   mitad 2   EL RAYO SALE DEL PECHO   (como el juego original)
#
# Tu juegas y aprietas `L` cuando veas el defecto. El registro sabe en cual de
# las dos mitades caiste, asi que no tienes que acordarte de nada.
#
# OJO, Y ES IMPORTANTE: durante la mitad 2 vuelve un defecto que ya tenias
# arreglado —*"no me deja apuntar a la persona que veo detras del objeto"*—.
# Es a proposito y es media partida; en cuanto sepamos cual es la causa, esto
# se apaga.
#
#   0 = apagado. Entonces manda `mira_sale_del_arma` como siempre y esto no
#       escribe absolutamente nada en el juego.
#
# El reloj NO empieza hasta que estas viendo por el casco: los ~20 segundos que
# tarda en entrar la realidad virtual se comerian una mitad entera (C-089).
# C-192: APAGADO. El carrusel hizo su trabajo -cinco vueltas, y las fotos
# dijeron en cual caia cada marca-, pero ya no hace falta: la foto nueva mide el
# origen del rayo directamente, que es mejor que compararlo a ciegas. Y asi te
# quitas de encima la mitad de la partida con el defecto viejo.
mira_carrusel_segundos = 0
mira_carrusel_espera = 8


# ---------------------------------------------------------------------------
# mira_rayo_corto_metros / mira_rayo_desvio_maximo   (C-190)
# ---------------------------------------------------------------------------
#
# Los dos unicos numeros con criterio de la sonda nueva, y estan aqui en vez de
# escondidos en el codigo para que se puedan mover sin compilar.
#
#   · mira_rayo_corto_metros: por debajo de estos metros se considera que el
#     rayo **se quedo clavado al lado del arma** en vez de llegar a algun sitio.
#
#   · mira_rayo_desvio_maximo: el punto donde acaba el rayo se lee de un sitio
#     del motor que salio de descompilarlo. Eso es una pista, no un hecho, asi
#     que **no se cree a ciegas**: si de verdad es donde acaba el rayo, tiene que
#     caer sobre la linea. Si se sale mas que estos metros, la sonda escribe
#     «no me fio» y no da ningun veredicto — que es justo lo que le falto a
#     C-189, donde di por bueno un numero que resulto ser un ajuste.
# ---------------------------------------------------------------------------
# mira_hueso_del_arma   (C-194)   *** LO CAZASTE TU MIRANDO EL LASER ***
# ---------------------------------------------------------------------------
#
# TUS PALABRAS: *"La linea del punto de mira sale del hombro, del personaje, no
# del arma. Por eso, cuando muevo los brazos, hay veces que los brazos se mueven
# de forma extraña, el punto de mira desaparece, pero el arma si la estoy
# apuntando a un lado. Ese punto de mira deberia estar en el arma."*
#
# TENIAS RAZON, Y EL MOTOR LO DICE CON TODAS LAS LETRAS. Lo que C-172 le daba al
# motor como origen del rayo es `getShootingStartPosition`, y esa funcion **no
# pregunta por el arma**: pregunta por `getLineOfFireStartBoneName()`, el hueso
# de la LINEA DE FUEGO. En el juego original ese hueso es del cuerpo, y con
# razon: el arma se bambolea con la animacion y la linea de tiro tenia que ser
# estable. En realidad virtual el arma ES tu mano, y entonces esa decision se
# vuelve justo lo contrario de lo que hace falta.
#
# MEDIDO: del origen del rayo al hueso `Bip01 R Gun` hay **0,91**, y **0,80 de
# esos hacia abajo**. Eso no es una holgura: es un hombro.
#
#   0   como hasta ahora: del hueso de la linea de fuego (el hombro)
#   1   del hueso `Bip01 R Gun`   <<< LO PUESTO
#   2   del hueso `Bip01 L Gun`
#
# SE PUEDE CAMBIAR CON EL JUEGO ABIERTO. Y lleva el mismo freno que C-172: si el
# hueso cayera mas lejos de `mira_salto_maximo`, no se toca y se cuenta.
mira_hueso_del_arma = 1


# ---------------------------------------------------------------------------
# mira_arranca_en_el_arma   (C-198)   *** LO VISTE TU, Y LA CAUSA ESTABA EN EL MOTOR ***
# ---------------------------------------------------------------------------
#
# TUS PALABRAS: *"Hay una linea recta, negra, que sale de la mano, y esta
# siempre es recta, pero el punto blanco, el punto de mira, nunca lo es. Estoy
# apuntando al suelo y la mira esta a mi derecha."*
#
# Y antes, el primer dia: *"Si muevo los brazos apuntando a zonas lejanas o
# objetos cercanos, el punto de mira se va por otro lado o choca con objetos y
# desaparece."*
#
# LAS DOS FRASES DESCRIBEN LA MISMA FUNCION DEL MOTOR, y esta vez no hubo que
# deducir nada: esta escrita en el binario con su nombre.
#
#   `X_Crosshair::update` recibe un punto y **NO tira el rayo desde ahi**.
#   Primero llama a `X_Crosshair::moveFromValidPositionToStartPosition()`
#   -el nombre lo escribe el propio motor en un mensaje de error-, que
#   **mueve la mira desde ese punto hasta otro, probando colisiones por el
#   camino**, y solo entonces tira el rayo, desde donde haya acabado.
#
# Y ese otro punto se calcula asi, dentro de `X_Character::update2DAiming`:
#
#     arranque = fila3 + proyeccion(objetivo - fila3, fila2)
#
# La fila 3 de esa matriz esta MEDIDA desde C-079: es la posicion de Max en el
# mundo. Siguio sus pasos metro a metro durante 3261 llamadas.
#
# O SEA: el rayo de la mira salia del EJE DEL CUERPO de Max, y el laser sale del
# ARMA. Dos rectas paralelas separadas por lo que hay del cuerpo al arma. Por
# eso el punto blanco nunca caia en la punta de la linea negra; por eso de lejos
# casi acertaba y de cerca se disparaba; y por eso «chocaba con objetos y
# desaparecia» —ese paseo va probando colisiones—.
#
# C-172 cambiaba el punto que se le PASA al motor. Correcto y necesario, pero no
# bastaba: el motor se iba de ese punto dos lineas despues. Esto cambia el sitio
# al que se va.
#
#   1   el rayo ARRANCA en el arma   <<< LO PUESTO
#   0   como antes: arranca en el eje del cuerpo de Max
#
# SE PUEDE CAMBIAR CON EL JUEGO ABIERTO. A 0 no se toca la matriz: el motor
# recibe la suya y el mod es como si no existiera (C-057).
#
# NECESITA `mira_sale_del_arma = 1`. Sin el, el arma en ejes del mundo no se
# calcula y esto no se aplica —y el resumen del arranque lo dice a gritos—.
mira_arranca_en_el_arma = 1


# ---------------------------------------------------------------------------
# laser_del_arma / laser_color / laser_tope_de_lineas   (C-193)   *** LO ELEGISTE TU ***
# ---------------------------------------------------------------------------
#
# LO QUE SE MIDIO EN TUS DOCE MARCAS. Seis acabaron a la altura 5.012, 5.013,
# 5.014, 5.016, 5.016 y 5.022 —un centimetro entre las seis— con el arma a 6.51.
# Eso es un plano horizontal metro y medio por debajo del arma: **el suelo**.
#
# Y el porque: la direccion que el mod le da al motor es EXACTAMENTE la de tu
# mano —el cabeceo coincide hasta la tercera cifra en las doce— y **tu mano
# apunta entre 3 y 26 grados hacia abajo** en todas ellas. Tu apuntas con los
# ojos; el juego apunta con tu muñeca.
#
# QUE HACE ESTO. Una linea del arma hasta donde acaba el rayo. Asi ves en todo
# momento adonde va el tiro, y la muñeca se corrige sola sin pensarlo. Es lo que
# hace Quakespasm VR, y Borderlands 2 VR resuelve lo mismo con un ajuste de
# inclinacion del arma en sus opciones de comodidad.
#
# NO SE PINTA NADA POR NUESTRA CUENTA: se le pide al motor, que ya sabe dibujar
# lineas y lo tiene exportado. Son cuatro llamadas y ni un parche.
#
#   1 = se dibuja  ·  0 = el proceso queda como si esto no existiera
laser_del_arma = 0

# El color, tal cual se le pasa al motor. El orden de los canales NO esta
# confirmado, y por eso el valor de serie es blanco: sale blanco sea cual sea.
laser_color = 4294967295

# El freno. `addDebugLine` no sabemos si alguien las borra cada fotograma; si la
# cuenta llega aqui, se deja de añadir. Mejor sin laser que con el mundo lleno
# de rayas. El diario dice la cuenta real.
laser_tope_de_lineas = 64


# ---------------------------------------------------------------------------
# mira_foto_del_rayo   (C-192)
#
# La foto del rayo, tomada DESDE DENTRO de la llamada del motor: el origen que
# usa, la direccion que recibe y donde acaba, las tres del mismo instante.
#
# C-191 lo midio desde fuera y midio la misma cosa dos veces: el motor MUEVE el
# punto de mira a donde acaba el rayo, asi que «donde esta» y «donde acaba» son
# el mismo numero. El origen no se guarda en ningun sitio —es un argumento— y
