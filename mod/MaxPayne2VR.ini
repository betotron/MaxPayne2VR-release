#
# Ese "punto dulce" es la firma del fallo. La posicion de tu mano se mide **en tu
# habitacion** -tu mano respecto a tu cabeza- y se le pega al hombro de Max **en
# los ejes de Max**. Mientras Max mira al frente los dos sistemas coinciden y
# todo cuadra. En cuanto gira, tu mano se le coloca torcida **justo los grados
# que haya girado**, y el brazo se pliega buscando un sitio imposible.
#
# Antes el fallo estaba ahi y no se veia, porque Max no giraba nunca. El giro no
# lo creo: lo destapo.
#
#   1   tu mano gira con el cuerpo de Max (lo puesto)
#  -1   igual, pero al otro lado
#   0   como estaba: solo funciona mirando al frente
#
# SI AL GIRAR LOS BRAZOS SE DOBLAN MAS QUE ANTES, PONLO A -1. De que lado gira
# este motor no se deduce, se mide, y en caliente cuesta diez segundos.
brazo_gira_con_el_cuerpo = -1


