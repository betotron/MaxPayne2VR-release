# ---------------------------------------------------------------------------
# 7. C-031: NO EMPUJAR LA CAMARA MIENTRAS EL MOTOR DIBUJA UN ESPEJO.
#
# Medido en C-030, no supuesto: la escena del mundo se dibuja DOS VECES por
