# ---------------------------------------------------------------------------
# brazo_gira_con_el_cuerpo   (C-142)
# ---------------------------------------------------------------------------
#
# LO DESCRIBISTE TU, y el detalle lo delata:
#
#   "Donde comienza la partida es un punto dulce, pudo apuntar bien y todo eso.
#    Pero si despues me muevo y apunto a otro lugar, como los brazos se mueven,
