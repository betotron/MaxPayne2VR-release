panel_en_las_manos = 1
panel_sobre_la_mano = 0.13
panel_letra_de_la_mano = 0.010


# ---------------------------------------------------------------------------
# aparcar_el_cursor   (C-117)
# ---------------------------------------------------------------------------
#
# LO QUE ARREGLA. Lo contaste tu:
#
#   "hay ocasiones en que entro a la partida y, de forma que no entiendo,
#    empieza a moverse como loco la camara. Si no fuera porque yo muevo el
#    mouse y lo centro (...) se queda loco para siempre."
#
# **Que se arregle moviendo el raton dice casi todo.** Max Payne 2 lee el raton
# en RELATIVO -cuanto se ha movido desde la ultima vez- y gira la camara con ese
# numero. Si ese numero se queda pegado en algo distinto de cero, la camara gira
# sin parar. Al moverlo de verdad, se recalcula y se arregla.
#
# Con esto a 1, el mod **aparca el cursor en el centro cada segundo mientras
# juegas**, que es exactamente lo que haces tu a mano. En el MENU no lo aparca:
# ahi el cursor es lo unico con lo que puedes moverte.
#
# Y ADEMAS SE MIDE: el registro anota cada segundo lo que el motor ve del raton.
# Si vuelve a pasar, esa linea dira si el numero esta pegado o no —y las dos
# respuestas sirven, porque una lo demuestra y la otra lo descarta—.
#
#   1   se aparca el cursor mientras juegas (lo puesto)
#   0   no se toca
