# A 0 el juego va exactamente como hasta ahora, con la camara detras.
# ---------------------------------------------------------------------------

camara_primera_persona = 1


# ---------------------------------------------------------------------------
# camara_altura_ojos  (C-056, y desde C-065 SE MUEVE CON LAS TECLAS M y N)
#                                                                  EN METROS
# ---------------------------------------------------------------------------
# Sube (+) o baja (-) el ojo desde el punto que el motor llama "la cabeza" de
# Max.
#
# POR QUE HACE FALTA, Y POR QUE 0 NO ES LO CORRECTO
#
#   El motor sabe decir donde tiene Max **el hueso de la cabeza**. Y ese hueso,
#   en cualquier muñeco con esqueleto, esta en la BASE DEL CRANEO, no en los
#   ojos. Los ojos van unos diez o quince centimetros mas arriba.
#
#   Y eso se nota mucho, porque **mirar el mundo desde mas abajo de lo que toca
#   hace que todo parezca mas grande**: es el efecto de ver una habitacion a la
#   altura de un niño. Es exactamente lo que reportaste el 2026-08-27: *"sigo
#   viendo el mundo y los sujetos un poco mas grandes de lo que deberia ser, y
#   posiblemente es porque la camara esta mas por debajo de lo que realmente es
#   la cabeza"*. El registro te dio la razon: la camara salia a **0,077 m por
#   debajo** de ese punto.
#
# NO TIENES QUE ADIVINAR EL NUMERO. LO MUEVES JUGANDO:
#
#     tecla  M    subir los ojos      un centimetro por toque
#     tecla  N    bajarlos            (si la dejas apretada, diez por segundo)
#
#   Ninguna de las dos hace nada en Max Payne 2 -esta comprobado contra la
#   lista de teclas del propio juego, en MP2_Init.ras- asi que no te van a
#   disparar ni a recargar sin querer.
#
#   Cada vez que se mueve, el registro escribe el numero LISTO PARA COPIAR
#   aqui. No tienes que apuntar nada a mano. Y al final de la partida sale
#   otra vez en el resumen, con un ">>> COPIA ESTO AL .ini".
#
# QUE MIRAR PARA SABER QUE ESTA BIEN
#
#   Una PUERTA. En este juego una unidad es un metro y una puerta mide unos
#   dos: tiene que quedarte bastante por encima de la cabeza, pero no enorme.
#   Y la tapa de un escritorio tiene que quedarte por la CADERA, no por el
#   pecho.
#
#   Si mides 1,70, tus ojos en la vida real estan a 1,58 del suelo. Busca esa
#   sensacion, no un numero.
#
# DE DONDE SALE EL 0.25 QUE VIENE PUESTO (2026-09-04, y es una MEDIDA tuya)
#
#   Lo bajaste tu con la tecla N, jugando, de 0.40 a 0.25, y lo dejaste ahi:
#   *"la ultima vez que la apreté es la medida de altura del personaje exacto"*.
#   Ademas marcaste el momento con la tecla L, asi que la foto de ese instante
#   esta en el registro (10:55:56 del 2026-09-04).
#
# POR QUE EL 0.40 DE ANTES SE QUEDO VIEJO, Y NO FUE UN ERROR TUYO
#
#   El 0.40 tambien era una medida tuya (C-065): *"ponlo en el numero max, es
#   casi la altura real de la cabeza, se ve genial"*. Lo que pasa es que lo
#   mediste **cuando la separacion entre tus ojos estaba en 0.2 m**, que es mas
#   del triple de la tuya. Con los ojos tan separados el mundo se percibe como
#   una maqueta, y la altura que se siente bien dentro de una maqueta no es la
#   misma que a tamaño real.
#
#   Cuando la separacion se corrigio a 0.060 -tu numero, medido por tu casco-,
#   **la altura se quedo sin revisar**. Este mismo archivo lo avisaba unas
#   lineas mas arriba. Quince centimetros de diferencia, y tu lo describiste
#   asi: *"veo que es mas grande que los personajes de dentro del juego"*.
#
#   LA LECCION, y vale para cualquier par de numeros de estos: **cuando se
#   corrige un ajuste, hay que volver a mirar los que se afinaron con el mal.**
#
#   EL TECHO SIGUE EN 1.20, no en 0.40, para que ningun valor quede pegado a un
#   limite sin comprobar por arriba.
# ---------------------------------------------------------------------------

camara_altura_ojos = 0.25


