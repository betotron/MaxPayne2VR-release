# con rayas. La que llevas va con un marco verde y su nombre debajo. Se va sola
# a los pocos segundos, y cada cambio nuevo reinicia la cuenta: si vas
# cambiando seguido, la fila se queda hasta que pares.
#
# LOS DIBUJOS SON NUESTROS. Los iconos del juego son trozos de una textura, y
# este mod solo sabe pintar rayas -las mismas del laser-. Asi que estan hechos a
# mano mirando la silueta de cada arma, para leerse pequeños y de un vistazo.
#
#   tira_segundos        cuanto se queda puesta. **0 la apaga del todo.**
#   tira_letra           lo alto de cada dibujo, en metros.
#   tira_sobre_la_mano   metros por encima de la mano derecha. Solo se usa con
