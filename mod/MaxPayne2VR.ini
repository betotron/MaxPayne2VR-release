# ---------------------------------------------------------------------------
# casco_color_srgb  (C-048)   ES EL CAMBIO DE ESTE CANDIDATO
# ---------------------------------------------------------------------------
# EL SINTOMA: *"hay mucha iluminacion al entrar en modo VR"*, *"esta como
# sobreexpuesto"*. Dos candidatos seguidos sin arreglarlo.
#
# LA CAUSA, y por que C-046 no lo arreglo:
#
#   DXVK entrega la imagen del juego en un formato que dice «sin curva de
#   color». Pero el formato no dice que hay dentro: dice como se INTERPRETA. Y
#   los bytes que Max Payne 2 escribe SI llevan la curva puesta, como los de
#   cualquier juego que dibuja directo a 8 bits.
#
#   La especificacion de OpenXR es tajante: todo lo que no sea un formato sRGB
#   "will be treated as linear values". O sea que el compositor cogia unos bytes
#   ya codificados y los volvia a codificar. Sobraba una vuelta, y por eso la
#   imagen sale demasiado clara.
#
#   C-046 cambio la cadena de sRGB a UNORM. Se puede demostrar que las dos
#   configuraciones dejan al compositor exactamente el mismo valor, y por eso el
#   sintoma no se movio ni un pelo. No fue un arreglo que fallara: era el mismo
#   defecto por dos caminos.
#
# A 1 se leen los mismos bytes con las gafas correctas: no se copia nada
# distinto, no se toca ni un byte, y el brillo sale como en el monitor.
#
# A 0 vuelve a como estaba en C-047, sobreexpuesto.
#
# Si la tarjeta no admitiera el formato, se vuelve solo al de antes y el
# registro lo dice a gritos. Nunca se queda a medias en silencio.
# ---------------------------------------------------------------------------

casco_color_srgb = 1


