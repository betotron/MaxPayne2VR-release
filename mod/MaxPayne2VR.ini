# ---------------------------------------------------------------------------
# torso_sigue_la_cabeza   (C-104)   *** EL CAMBIO DE ESTE CANDIDATO ***
# ---------------------------------------------------------------------------
#
# LO QUE ARREGLA, y son TRES cosas de una sola causa. Lo dijiste tu:
#
#   "si yo giro la cabeza y apunto hacia otro lado, los brazos se vuelven
#    locos y estoy viendo la espalda de frente del personaje y el punto de
#    mira se fue"
#
# La causa es una: **la camara giraba contigo y el cuerpo de Max no**. Tu
# mirabas a la derecha, pero el hombro de Max seguia encarado al frente. Tu
# mano fisica quedaba entonces a noventa grados de un hombro que no se habia
# movido, y el brazo tenia que retorcerse para llegar. De paso te encontrabas
# tu propio cuerpo cruzado en la vista, y el disparo salia de un hombro que
# miraba a otro lado.
#
# Lo diagnosticaste tu y era correcto: el cuerpo tiene que seguirte.
#
# EL NUMERO es cuanto te sigue:
#
#   1      te sigue del todo (lo puesto)
#   0.5    te sigue a medias: puedes mirar de reojo sin girar el cuerpo
#   0      apagado, como antes
#   -1     si el cuerpo gira AL REVES que tu, pon esto
#
# SE PUEDE CAMBIAR CON EL JUEGO ABIERTO. Prueba valores sin cerrar nada.
# C-104 SE RECHAZO Y C-105 LO ARREGLA. Lo que fallaba, y lo midio el registro:
#
#     TORSO girado    = 12905     (contaba cada escritura)
#     cabeza encogida =  2582     (cuenta una vez por fotograma)
#     12905 / 2582    =  5,0 exacto
#
# El giro se escribia CINCO VECES por fotograma, y como era un incremento, se
# multiplicaba por cinco: movias la cabeza 10 grados y el torso se retorcia 50.
# Ahora la escritura es absoluta: cinco veces dan el mismo resultado que una.
#
#   1   el cuerpo te sigue (lo puesto)
#   0   apagado
#  -1   si girase al reves
# C-106 arregla los tres fallos que el registro de C-105 dejo medidos.
