#      20 m/s2. Es un objeto fisico que choca con las cosas.
#   2. Y el sitio al que la lanza CAMBIA SEGUN DONDE MIRES: 4,00 m detras
#      mirando de frente, pero 0,40 m mirando hacia arriba. Subir la mirada
#      mueve el objetivo de la camara TRES METROS Y MEDIO.
#   3. Junto a una puerta, esa esfera de 0,6 m choca con el marco y la camara
#      salta. POR ESO EL DEFECTO SALE EN LAS PUERTAS.
#
# LO QUE SE HACE, Y POR QUE ES DISTINTO DE TODO LO ANTERIOR:
# no se mueve nada por detras del motor -eso es lo que agujerea las puertas, y
# esta medido dos veces en docs/MANUAL-DEL-MOTOR.md-. Se le CONTESTA otra cosa
# cuando pregunta. El motor coloca la camara el mismo, sabiendo donde la pone, y
# recorta, ilumina y dibuja desde ahi.
#
# A LAS TRES DISTANCIAS SE LES CONTESTA LO MISMO. Ese es el punto: si las tres
# valen igual, mirar arriba o abajo deja de mover la camara.
