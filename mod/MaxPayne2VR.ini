# o vibra, bajalo.
#
# SI EL CUERPO GIRA AL REVES DE COMO GIRAS TU, PONLO NEGATIVO. De que lado gira
# el raton en este motor tampoco se puede deducir, y un numero negativo lo
# resuelve en diez segundos sin compilar nada.
giro_velocidad = -20


