#
# Y es verdad. La camara del mod va en el hueso de la cabeza de Max, y ese hueso
# **bota con la animacion de andar**. En una pantalla eso da sensacion de paso;
# en un casco, tu cabeza de verdad no bota, y el oido no se lo cree. Es de las
# cosas que peor sientan en realidad virtual.
#
# Solo se toca la ALTURA, y con cuidado: **lo pequeño y rapido se suaviza -el
# bote- y lo grande se sigue al instante** -una caida, una escalera, agacharte-.
# Suavizar todo por igual haria que caerse llegara tarde, y eso marea igual.
#
#   1      no suaviza nada: como estaba
#   0.15   quita el bote sin que se note retraso (lo puesto)
#   0.05   mas suave todavia; puede notarse un pelin de retraso al agacharte
#
# SE PUEDE CAMBIAR CON EL JUEGO ABIERTO.
