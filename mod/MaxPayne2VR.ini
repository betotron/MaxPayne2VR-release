#     AttractVideoName = "movies\startup.bik";
#     AttractVideoInputIdleTime = 120;   // segundos quieto en el menu
#
# O sea que es el MISMO video dos veces: al arrancar, y otra vez si te quedas
# dos minutos parado en el menu.
