# ===========================================================================
#  EL CENTRADO YA NO TE LO PIDE NADIE.        (C-064, y no es un ajuste)
#
#  Tenias razon: *"encuentro estupido tener que apretar la tecla K para centrar.
#  El juego, cuando tenga el casco puesto, deberia centrar solo"*.
#
#  AHORA SE CENTRA SOLO, por dos caminos, y el registro dice cual se usa:
#
#    1. Si el runtime sabe decir cuando el casco SE PONE en una cabeza
#       (`XR_EXT_user_presence`), se centra en ese instante. Es el camino bueno.
#    2. Si no lo sabe, se centra cuando la sesion toma el FOCO, que en la
#       mayoria de los runtimes pasa al ponerse el casco.
#
#  Y se centra otra vez CADA VEZ que te lo vuelves a poner.
#
#  LA TECLA K SIGUE, pero para cuando TU quieras: si te has movido de sitio, si
#  te has girado en la silla, o si el centrado automatico no acerto.
#
#  La extension no se pide si el runtime no la tiene: pedir una extension que no
#  existe hace fallar la sesion ENTERA, y eso te dejaria sin realidad virtual por
#  querer una comodidad.
# ===========================================================================


# ---------------------------------------------------------------------------
# mandos_openxr  (C-068)   *** ES EL CAMBIO DE ESTE CANDIDATO ***
# ---------------------------------------------------------------------------
# LEER LOS MANDOS DEL CASCO. Y NADA MAS: por ahora SOLO SE ANOTAN.
#
# Este candidato NO cambia nada de lo que ves ni de como se juega. Es el primer
# paso del bloque de las manos y el arma, y va solo por un motivo:
#
#   Si esto viniera pegado a mover el arma y no funcionara, no habria forma de
#   saber cual de las dos cosas fallo. Y averiguarlo cuesta una partida.
#
# La pregunta que contesta, que es la que hay que contestar antes que ninguna:
# **¿nos llega la mano, y con que numeros?**
#
# QUE MIRAR EN EL REGISTRO, cada segundo:
#
#   MANOS: perfil= /interaction_profiles/oculus/touch_controller  (N lecturas...)
#   MANOS: DERECHA  SEGUIDA  pos= 0.21 1.02 -0.35  gatillo=0.00 agarre=0.00
#   MANOS: IZQUIERDA SEGUIDA pos= -0.19 1.01 -0.33 gatillo=0.00 agarre=0.00
#
# Mueve la mano derecha: los tres numeros de `pos=` tienen que moverse. Aprieta
# el gatillo: `gatillo=` tiene que subir a 1.00. Si eso pasa, **el camino entero
# funciona** y el paso siguiente se puede escribir con datos y no con suposiciones.
#
# SI DICE `sin foco` Y NADA MAS: no es un fallo. Es lo que pasa cuando tienes un
