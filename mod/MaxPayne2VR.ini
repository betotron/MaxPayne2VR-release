# ---------------------------------------------------------------------------
# 11-quater. EL GATILLO DEL MANDO DISPARA  (C-074)
#            *** ES EL CAMBIO DE ESTE CANDIDATO ***
#
# C-073 QUEDO RECHAZADO, y no se adivina por que: el registro lo dijo. El gancho
# se puso, apretaste el gatillo 3 veces y el diario lo anoto, y **el motor
# pregunto CERO veces** por el boton del raton mientras jugabas. Las 19 que
# salieron llegaron justo despues de que pulsaras ESC: el raton se lee en los
# MENUS, no jugando.
#
# La razon, leida en disco y gratis: `X_GameObjectsMFC.dll` -donde vive Max- no
# importa NADA de la capa de entrada. El personaje no lee el raton. Todo pasa
# dentro de `maxpayne2.exe`, que pregunta por el ENLACE ("esta pulsado SHOOT?"),
# y ese enlace consulta al raton por dentro, sin pasar por ninguna tabla.
#
# C-074 sube un piso: en vez de mentirle al raton, le contesta al enlace.
#
# Aprietas el gatillo del mando derecho y Max dispara.
#
# COMO, Y POR QUE NO DE OTRA MANERA. El juego lee la entrada con DirectInput,
# que NO mira los mensajes de Windows: le pregunta al driver. Por eso
# "simular una tecla" no funciona con este juego, y por eso todas las
# soluciones de mando que existen (Xpadder, Steam Input, reWASD) traducen
# mando -> teclado/raton FUERA del juego.
#
# Nosotros estamos dentro. Cuando el motor pregunta "esta pulsado el boton
# izquierdo del raton?", le contestamos que si mientras tengas el gatillo
# apretado. El raton de verdad sigue funcionando igual: solo se ANADE.
#
# QUE EL DISPARO ES EL BOTON IZQUIERDO no se adivina. Lo dice el guion de
# configuracion del propio juego, en texto plano:
#
#     [SHOOT]
#     PrimaryDefaultType  = TYPE_MOUSEBUTTON;
#     PrimaryDefaultValue = VALUE_LMB;      // 0x0
#
# EL GATILLO ES UN ESTADO, NO UN DISPARO. Lo pediste asi y es lo correcto: se
# mantiene apretado mientras tu lo mantengas, y **es el arma la que decide** si
# eso es un tiro o una rafaga. Si se tradujera a "un disparo por pulsacion",
# las automaticas dejarian de ser automaticas.
#
# Aprieta por encima de 0,60 y suelta por debajo de 0,40, para que un gatillo
# tembloroso no repiquetee.
#
# NECESITA `mandos_openxr = 1`. A 0 el gatillo se queda a cero y no pasa nada.
#
# A 0 aqui, NI UNA casilla del proceso se toca.
# ---------------------------------------------------------------------------

gatillo_dispara = 1


# ---------------------------------------------------------------------------
# 11-quinquies. LOS MANDOS MANEJAN EL JUEGO  (C-075)
#               *** ES EL CAMBIO DE ESTE CANDIDATO ***
#
# C-074 quedo ACEPTADO -"oprimo y dispara como si lo hiciera de PC"-, y con el
# quedo probado el mecanismo. Ademas trajo el mapa de enlaces, que contesto la
# pregunta que lo abria todo: **el motor consulta las teclas de andar por el
# mismo sitio que el boton de disparo.**
#
#     ENLACES: (t1,v17)x6468  (t1,v31)x6468  (t1,v30)x6468  (t1,v32)x6468
#                DIK_W          DIK_S          DIK_A          DIK_D
#
# EL MAPA, que decidiste tu:
#
#   MANDO DERECHO                       MANDO IZQUIERDO
#     gatillo  -> disparar                palanca  -> andar (hacia donde miras)
#     agarre   -> USAR (tecla E)          X        -> camara lenta
#     A        -> recargar                Y        -> cambiar de arma
#     B        -> saltar                  gatillo  -> disparar tambien
#                                         agarre   -> analgesico
#
