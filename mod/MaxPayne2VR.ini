#
# Para esa pasada nuestra "derecha" tambien esta reflejada, asi que empujarla
# igual la manda al lado contrario. Eso es lo que se ve como el arma
# desplazandose cerca de un objeto.
#
# `X_Mirror::beginUpdate` y `endUpdate` abren y cierran esa pasada. Entre una y
# otra, no se empuja. No es una suposicion sobre posiciones: es el motor
# diciendo "ahora estoy dibujando un espejo".
#
# A 0 se vuelve al comportamiento de C-028.
