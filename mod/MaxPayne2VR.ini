# ---------------------------------------------------------------------------
# 1. LA SEPARACION ENTRE LOS DOS OJOS, EN METROS.
#
# ===========================================================================
#  YA NO SE ADIVINA: UNA UNIDAD DEL JUEGO ES UN METRO.
#
#  Lo dice el guion de configuracion del propio juego, dentro de MP2_Init.ras,
#  y esta en texto plano:
#
#      ShootDodgeTargetOffset = 0.7;   // in meters
#      CrouchTargetOffset     = 0.35;  // in meters
#      InitialBackwardsSpeed  = 5.0;   // m/s
#      BackwardsAcceleration  = 20.0;  // m/s^2
#
#  Lo que decia aqui antes -"una unidad son unos 30 o 40 cm"- salia de medir un
#  pasillo a ojo y ERA FALSO. Se deja escrito para que nadie lo vuelva a creer.
# ===========================================================================
#
# LO QUE ESO SIGNIFICA PARA ESTE NUMERO:
#
#     0.2  = 20 CENTIMETROS de separacion entre los ojos.  <- lo que hay puesto
#     0.064 = 6,4 cm, que es lo que mide una persona de verdad.
#
#   O SEA QUE AHORA MISMO LOS OJOS ESTAN TRES VECES MAS SEPARADOS DE LA CUENTA.
#
# NO LO CAMBIES TODAVIA. Este candidato prueba UNA cosa -la camara en la cabeza
# de Max- y si se tocan dos a la vez no se sabe cual hizo que. Primero juzga la
# primera persona.
#
# DESPUES, cuando quieras, cambia este numero a 0.064 y vuelve a abrir el juego:
# no hay que reinstalar nada. Deberias notar que el mundo se hace mas pequeno y
# mas solido, mas de tu tamano.
#
#   0      = apagado. OJO: a 0 el casco no se enciende, porque sin separacion no
#            hay dos ojos que entregar. El registro lo dice a gritos.
#
# *** ESTE NUMERO ES LA DISTANCIA ENTRE TUS DOS OJOS, EN METROS. ***
#
# HASTA C-066 ESTUVO EN 0.2 — VEINTE CENTIMETROS. Una persona tiene unos 6,3.
# Estaba TRES VECES Y MEDIA de mas, y no era una sospecha: esta medido en el
# registro de C-062, donde la camara aparece en -23.607, -23.702 y -23.797, o
# sea a un decimetro a cada lado del centro.
#
# QUE PROVOCA ESO, Y POR QUE TU LO NOTASTE
#
#   Separar los ojos MAS de lo que los tienes hace que el mundo se perciba
#   **mas cerca y mas pequeño**. Es el efecto "mundo de juguete", y esta
#   descrito en la literatura de realidad virtual: al aumentar la separacion
#   entre las camaras, el entorno se percibe como una maqueta.
#
#   Tu lo dijiste sin conocer nada de eso: *"noto los espacios mas pequeños,
#   como que todo esta cerca"*. Es la descripcion exacta.
#
#   Y explica lo que quedaba: si la HABITACION se encoge pero los OBJETOS
#   mantienen su tamaño en tu vista, los objetos parecen grandes PARA la
#   habitacion. *"Los objetos siguen siendo un poco grandes."*
#
# NO TIENES QUE ADIVINAR TU NUMERO. Pasan dos cosas ahora:
#
#   1. EL REGISTRO TE DICE EL TUYO. Tu casco sabe la separacion que tienes
#      configurada, y el runtime nos la da en cada fotograma. Busca la linea:
#          TU CASCO DICE QUE TUS OJOS ESTAN A 0.0xx m
#      Ese es TU numero, medido, no una media de nadie.
#
#   2. LO MUEVES JUGANDO, igual que la altura:
#          tecla  .   separar mas    (un MILIMETRO por toque)
#          tecla  ,   juntar mas
#      Aqui el paso es de un milimetro y no de un centimetro a proposito: de
#      6,3 a 7,3 cm ya es un 16% de cambio en el tamaño del mundo.
#
# QUE MIRAR: si los espacios se sienten estrechos y todo demasiado cerca, estan
# DEMASIADO SEPARADOS (junta con la coma). Si el mundo se ve plano, como un
# cuadro pintado, estan demasiado juntos (separa con el punto).
#
# ESTE AVISO YA SE COBRO, Y ACERTO (2026-09-04). Decia que la altura de los
# ojos y la separacion se influyen, y que el `camara_altura_ojos = 0.40` se
# habia elegido con la separacion todavia en 0.2. Al corregirse la separacion a
# 0.060, la altura se quedo alta: el usuario se veia *"mas grande que los
# personajes de dentro del juego"*. Con la tecla N la bajo a **0.25**, que es lo
# que hay puesto ahora.
# ---------------------------------------------------------------------------

# TU NUMERO, MEDIDO EN LA PARTIDA DE C-067: tu casco dijo 0.060 m (5,998 cm).
# Eso no es una media de nadie: es lo que TU tienes configurado en tu Quest 3, y
# nos lo dio el runtime. Por eso esta puesto exactamente ese.
desplazamiento_en_el_motor = 0.060


