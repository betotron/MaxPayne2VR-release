# ---------------------------------------------------------------------------
# camara_primera_persona  (C-056)   *** ES EL CAMBIO DE ESTE CANDIDATO ***
# ---------------------------------------------------------------------------
# EL SINTOMA: la camara va en vista aerea, cuatro metros por detras de Max, y
# en las puertas "Max y todo se multiplica como un espejo".
#
# LO QUE SE ENCONTRO, LEYENDO LOS DATOS DEL JUEGO Y SIN GASTAR UNA PARTIDA:
# `MP2_Init.ras` lleva el guion de configuracion EN TEXTO PLANO, con los
# comentarios de los propios autores. Su seccion [camera] dice:
#
#     SphereRadius                    = 0.1;
#     CollisionPredictionSphereRadius = 0.6;   // bigger radius -> more eager
#                                              // to avoid obstacles
#     MaximumPredictionIterations     = 7;
#     InitialBackwardsSpeed           = 5.0;   // m/s
#     BackwardsAcceleration           = 20.0;  // m/s^2
#
#     // camera is cast from it's startpoint directly to this direction
#     // when it's ABOVE player
#     UpFollowDistance     = ( 0.06, 0.40, -0.40 );
#     // ...when it's BEHIND player
#     MiddleFollowDistance = ( 0.06, 0.5,  -4.00 );
#     // ...when it's BELOW player
#     DownFollowDistance   = ( 0.06, 0.80, -1.00 );
#
# Y unas lineas mas arriba, en otra seccion:
#     ShootDodgeTargetOffset = 0.7;   // IN METERS
#
# O SEA QUE UNA UNIDAD DEL JUEGO ES UN METRO. Lo dice el motor, no nosotros.
# Llevabamos adivinandolo desde el principio.
#
# LO QUE ESO EXPLICA DE GOLPE:
