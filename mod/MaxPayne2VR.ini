#   "presiento que lo mejor es quitar el cuerpo (...) no se si tenes solamente
#    el arma flotando, o la muñeca y la mano con el arma"
#
# **Todos los mods de VR maduros hacen exactamente eso.** Fallout 4 VR dibuja al
# jugador como manos sueltas; el de Half-Life 2 usa manos flotantes; el de
# Garry's Mod trae un interruptor llamado literalmente "usar manos flotantes".
# El cuerpo completo con IK es la excepcion que la gente añade aparte, y son
# proyectos enormes.
#
# El plano cercano decide a que distancia deja de dibujarse lo que tienes
# delante. A 0,25 tapa la cara. Subiendolo, va tapando cuerpo:
#
#     0.25   lo de siempre: solo la cara
#     0.45   deberia empezar a tapar el pecho
#     0.60   tapa casi todo el cuerpo; el brazo estirado se sigue viendo
#     0.80   probablemente solo veas la mano y el arma
#
# EL PRECIO, dicho antes de que lo veas: la camara no distingue tu cuerpo de una
# pared. Cuanto mas alto, mas se recorta tambien lo que tengas MUY cerca.
# Por eso se prueba en vivo y se busca el numero justo.
#
# SE PUEDE CAMBIAR CON EL JUEGO ABIERTO.


