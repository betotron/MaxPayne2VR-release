# ---------------------------------------------------------------------------
# GUARDAR LA PARTIDA YA NO CIERRA EL JUEGO   (C-220)
# ---------------------------------------------------------------------------
#
# Tu: *"despues de un rato jugando, el juego, al menos en modo realidad
# virtual, se cierra; ya no lo veo en los lentes"*, con este cartel:
#
#     P_D3D::getScreen - LockRect failed : D3DERR_INVALIDCALL
#
# QUE PASABA. Al guardar la partida, el juego hace una foto pequeña de la
# pantalla para enseñarla en la lista de partidas guardadas. Para eso prepara
# una hoja **del tamaño del escritorio** -1920x1080- y luego le pide el trozo
# **del tamaño al que dibuja el juego** -2715x1527, que es el que tienes puesto
# y el que hace que se vea nitido en el casco-. Ese trozo no cabe en esa hoja,
# Direct3D contesta que no, y el motor convierte ese "no" en un error que cierra
# el juego.
#
# No es cosa de la realidad virtual: le pasaria igual sin el mod. Lo que si es
# nuestro es que TU juegues a 2715x1527, porque es lo que le da resolucion al
# casco. Bajar el juego a 1920x1080 tambien lo arreglaria, y se veria peor.
#
# A 1: cuando la foto no cabe, no se le deja hacerla. La partida se guarda
#      igual; lo unico que se pierde es la miniatura de esa partida. Y si el
#      motor reventara por otro motivo que yo no haya previsto, se recoge y se
#      anota en el registro en vez de cerrar el juego.
# A 0: no se toca ni una casilla y el juego se comporta como de fabrica -o sea,
#      volveria a cerrarse al guardar-.
#
# COMO SE SABE SI FUNCIONA: el diario escribe
#   FOTO AL GUARDAR  puesta (1 casillas) | preguntas=N dejadas=N EVITADAS=N | ...
#     ... | el juego dibuja a 2715x1527 y la pantalla mide 1920x1080
# Si `preguntas` se queda a 0 toda la partida es que no guardaste, no que
# falle. Si sube `EVITADAS`, ahi tienes un cierre que no ha ocurrido.
#
# EL GANCHO se monta al arrancar, asi que este numero solo se lee al abrir el
# juego.
foto_al_guardar = 1

# ---------------------------------------------------------------------------
# CADA CUANTO ESCRIBE EL DIARIO   (C-221)
# ---------------------------------------------------------------------------
#
# El registro se quedaba MUDO a los cinco minutos. Tu partida del 3 de
# septiembre duro quince, y todo lo que me contaste -que el arma vuelve sola,
# que al quitarte el casco el juego se rompe- paso en los once minutos que no
# estan anotados. No es que midiera mal: es que ya no estaba.
#
# La cuenta: el bloque del diario son unas 40 lineas y se escribia una vez por
# segundo. El tope son 12000 lineas. 40 x 300 = 12000, o sea que se acababa
# SIEMPRE a los cinco minutos, jugaras lo que jugaras.
#
# Lo que se cambia no es el tope -el registro ya pesa 82 MB- sino el RITMO:
# los dos primeros minutos se anota cada segundo, como siempre, y a partir de
# ahi cada tantos segundos. Los contadores son acumulativos, asi que mirarlos
# menos veces no pierde nada.
#
#   20 = lo de ahora. Cubre mas de una hora de partida.
#    0 = como antes: cada segundo siempre, y muda a los cinco minutos.
#
# Lo que pasa por un SUCESO -las teclas, los botones del mando, la foto de la
# tecla L, los cambios de estado del casco- no depende de esto: sigue saliendo
# en el instante en que pasa.
#
# Se lee al abrir el juego.
diario_espaciado_segundos = 20


# ---------------------------------------------------------------------------
# EL PANEL DEL JUGADOR   (C-209)
# ---------------------------------------------------------------------------
#
# Tu: *"necesito ver un HUD, un panel donde muestre la salud de mi personaje,
# las balas que me quedan y todo eso; junto tambien poder observar cuando cambio
# de arma, saber que arma estoy cambiando"*.
#
# POR QUE NO VALE EL HUD DEL JUEGO. El original se dibuja en las esquinas de una
# pantalla plana de 4:3. En el casco esas esquinas caen fuera de donde se puede
# mirar comodamente, y por eso no lo ves. Moverlo de sitio no se puede: lo pinta
# el motor donde el sabe.
#
# ASI QUE SE HACE UNO NUEVO, con las mismas rayas que ya dibujan el laser. Se
# pone delante de ti y un poco por debajo: miras hacia abajo y esta ahi, como un
# reloj de pulsera. No sigue al cabeceo a proposito; si lo hiciera, taparia el
# juego todo el rato.
#
# QUE ENSEÑA, de arriba abajo:
#     HEALTH 36%                      KALASHNIKOV
#     [=======   ]                    27 / 27
#     BULLET TIME
#     [====      ]
#     PAINKILLERS 8
#
#   A la IZQUIERDA la vida, el tiempo bala y las pastillas. A la DERECHA el arma
#   y las balas. Los ajustes de aqui abajo son los del modo FLOTANTE; si tienes
#   `panel_en_las_manos = 1` -que es lo puesto-, manda el bloque siguiente.
#
#   panel_del_jugador    1 encendido, 0 apagado.
#   panel_distancia      metros por delante de tus ojos. Mas lejos = se ve mas
#                        pequeño pero cuesta menos enfocarlo.
#   panel_altura         metros por DEBAJO de tus ojos. **Negativo es mas abajo.**
#                        Con -0,42 a 1,10 m hay que bajar la vista unos 21 grados.
#   panel_ancho          **la separacion entre los dos grupos**, en metros, de
#                        extremo a extremo. En medio no se dibuja nada.
#   panel_altura_letra   lo alto de cada letra, en metros.
#   panel_espejo         0 normal. **Si el texto se lee al reves, pon 1.**
#
# LOS SEIS SE CAMBIAN CON EL JUEGO ABIERTO.
#
# COMO SE SABE SI FUNCIONA: el diario escribe dos lineas
#   PANEL  encendido | fotogramas=N pintados=N | rayas N pedidas -> N puestas | ...
#   PANEL  datos: lecturas=N | armas reconocidas=18 (tabla hecha) | fallos: ...
# «pedidas 120 -> puestas 0» y «sin ojo» y «sin datos» son tres averias
# distintas y se arreglan en sitios distintos.
panel_del_jugador = 1
panel_distancia = 1.10
panel_altura = -0.42
panel_ancho = 1.05
panel_altura_letra = 0.024
panel_espejo = 0

