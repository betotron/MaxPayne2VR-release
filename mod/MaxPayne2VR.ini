#
#   MANO IZQUIERDA          MANO DERECHA
#   HEALTH 36%              KALASHNIKOV
#   [=======   ]            27 / 27
#   BULLET TIME
#   [====      ]
#   PAINKILLERS 8
#
# Cada uno se pone ENCIMA de su mano y **se gira para mirarte**, pero se queda
# vertical: el texto no se ladea aunque gires la muñeca. Si bajas la mano, su
