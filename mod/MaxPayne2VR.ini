# ---------------------------------------------------------------------------
# giro_arranque_segundos / giro_empujon_maximo   (C-139)
# ---------------------------------------------------------------------------
#
#   "Si gira conmigo, aunque el giro es brusco; deberia seguirme y ser suave."
#
# Tenias razon, y lo confirma como lo hacen otros. VRIK -el solucionador de
# cuerpo que usan los mods de Skyrim VR, y adaptado el de Fallout 4- realinea el
# cuerpo con la velocidad LIMITADA y suavizada, y su documentacion avisa del
# compromiso: mas suave = menos reactivo. Por eso son dos numeros que puedes
# tocar, no una constante.
#
# Lo de antes empujaba proporcional al error: cruzabas la holgura con 90 grados
# de desfase y salia un empujon enorme **en el primer fotograma**. Ese era el
# tiron.
#
#   giro_arranque_segundos   cuanto tarda en coger velocidad. Suaviza la
#                            ENTRADA, que es donde estaba el tiron.
#                            Mas alto = mas suave y mas perezoso.
#
#   giro_empujon_maximo      techo de velocidad. Por muy lejos que mires, no
#                            gira mas rapido que esto. Suaviza el MEDIO.
#                            Mas bajo = mas calmado.
#
# LOS DOS SE CAMBIAN CON EL JUEGO ABIERTO.
giro_arranque_segundos = 0.30
giro_empujon_maximo = 25


# ---------------------------------------------------------------------------
# brazo_hombro_al_lado   (C-140)
# ---------------------------------------------------------------------------
