# ---------------------------------------------------------------------------
# ELEGIR EL ARMA ANTES DE CAMBIARLA   (C-216)
# ---------------------------------------------------------------------------
#
# Tu: *"la idea es que cada vez que apriete la Y voy cambiando entre armas, y
# con gatillo selecciono las armas, o con algun otro boton que no genere el
# disparar al seleccionar. Porque en la actualidad apreto la Y y se queda como
# pegado. No funciona de forma fluida."*
#
# COMO FUNCIONA AHORA:
#
#   1. Aprietas **Y** -o el boton que diga `arma_que_boton`-: se abre la fila de
#      armas delante de ti y el marco verde salta a la SIGUIENTE. El arma que
#      llevas en la mano **no cambia todavia**.
#   2. Aprietas Y otra vez y el marco avanza otra. Y otra.
#   3. Aprietas el **gatillo derecho** y el arma cambia a la marcada.
#   4. Si no haces nada durante `selector_segundos`, la fila se cierra y **no
#      cambia nada**.
#
# MIENTRAS LA FILA ESTA ABIERTA, EL GATILLO DERECHO NO DISPARA: esta eligiendo.
# Se cierra en cuanto aceptas, asi que la pausa dura lo que tardes en elegir. Si
# prefieres no perder el gatillo nunca, pon `arma_boton_aceptar = 1` y entonces
# se acepta con el **clic de la palanca izquierda**.
#
# EN EL JUEGO ORIGINAL ESTO NO EXISTE: `[` y la rueda del raton cambian el arma
# en el acto, y las teclas 1..6 saltan de grupo. Lo de elegir y aceptar es un
# añadido para el casco, donde no puedes mirar un HUD de esquina mientras giras
# la rueda.
#
#   selector_de_armas    1 = elegir y aceptar. **0 = el boton cambia el arma
#                        directo, como antes de C-216.**
#   selector_segundos    cuanto se queda abierta la fila sin tocarla.
#   selector_espera      cuanto se espera antes de dar un golpe por PERDIDO.
#                        Normalmente no hace falta: el mod no vuelve a pulsar
#                        hasta que ve que el arma ha cambiado de verdad.
#   arma_boton_aceptar   0 gatillo derecho, 1 clic de la palanca izquierda,
#                        2 boton B, 3 boton A, 4 agarre derecho, 5 boton X.
#   selector_al_reves    **Ponlo a 1 si al aceptar ves el arma pasando por todas
#                        las demas antes de llegar a la que elegiste.** El guion
#                        del juego dice cual es el orden de las armas pero no
#                        dice hacia donde va, y esto lo invierte. Llega a la
#                        misma arma de las dos formas; con el valor bueno llega
#                        de un tiron.
#   selector_paciencia   TOPE DE SEGURIDAD, no un ritmo: pasados estos
#                        segundos se deja de intentar, pase lo que pase. Esta
#                        puesto absurdamente lejos a proposito y no deberia
#                        llegar nunca; si el registro dice que llega, es que
#                        algo va mal, no que haga falta subirlo.
#
# LOS SEIS SE CAMBIAN CON EL JUEGO ABIERTO.
selector_de_armas = 1
selector_segundos = 4.0
selector_espera = 1.00
arma_boton_aceptar = 0
selector_al_reves = 0
selector_paciencia = 20.0

# ---------------------------------------------------------------------------
# COMO SE CAMBIA EL ARMA   (C-219)
# ---------------------------------------------------------------------------
#
# Tu: *"la selecciono, le doy gatillo, y nunca se cambia el arma en tiempo
# real"*. Y el registro te daba la razon: el motor recibio los once avisos de
# «arma siguiente» y **no cambio ni una vez**.
#
# Insistir mas no valia: ya se probo con 72 golpes y con 58. Asi que ahora el
# mod **le pone el arma al personaje directamente**, con la propia funcion del
# juego, que suelta el arma vieja, coge la nueva, la recarga y ajusta la mira.
#
# Lo que se pierde es la animacion de guardar y sacar: el cambio es instantaneo.
#
# C-223: Y LA PUERTA BUENA NO ERA LA QUE USABA C-219.
#
# Tu, despues: *"selecciono un arma y si cambia, pero cuando doy el primer
# disparo cambia el arma a otra automaticamente, y el sonido del disparo se nota
# que era de otra; siempre a la Kalashnikov"*.
#
# La funcion que usaba C-219 cambia el arsenal -el modelo, los sonidos, la mira-
# y NADA MAS. El cambio de verdad del motor hace cuatro cosas mas, y dos de ellas
# son justo las que fallaban: pone el campo con el que el motor resuelve EL
# DISPARO -por eso el primer tiro salia con el arma vieja y luego te devolvia
# esa-, y pone **el reparto de manos** del arma nueva -por eso te aparecia un
# arma en cada mano cuando no tocaba-.
#
# Ahora se llama a la completa, que ademas comprueba ella sola si puedes coger
# esa arma.
#
#   1 = el cambio ENTERO, como lo hace el motor (lo de ahora)
#   2 = solo el arsenal, que es lo que hacia C-219
#   0 = a base de <<arma siguiente>>, como en C-218
selector_directo = 1

