# COMO SE SABE SI FUNCIONA: el diario escribe
#   VIDEO  gancho puesto | casillas=1 | preguntas=N saltados=N pasaron=0 | ultimo: movies\startup.bik
# Si `preguntas` se queda a 0, el video no sale por esta puerta y hay que
# buscar otra: eso es una averia distinta de "el gancho no se puso".
